// ========= GOALS =========
function Goals({ data, update }) {
  const [modal, setModal] = useState(false);
  const [form, setForm] = useState({ name: "", target: "", current: "", targetDate: "", category: "Saving" });

  // Compute live bucket balances for linked goals
  const SNAPSHOT = "2026-05-14";
  const allocs = data.settings.allocations;
  const liveBucketBalance = (key) => {
    if (!key) return null;
    const start = data.startingBalances[key] || 0;
    const newIncome = data.incomeEntries.filter(e => e.date > SNAPSHOT).reduce((s, e) => s + e.net, 0);
    const allocated = (newIncome * (allocs[key] || 0)) / 100;
    const spent = data.expenses.filter(e => e.bucket === key && e.date > SNAPSHOT).reduce((s, e) => s + e.amount, 0);
    return start + allocated - spent;
  };

  const handleAdd = () => {
    if (!form.name || !form.target) return;
    update(d => ({
      ...d,
      goals: [...d.goals, { ...form, id: Date.now(), target: parseFloat(form.target), current: parseFloat(form.current) || 0, priority: d.goals.length + 1 }],
    }));
    setModal(false);
    setForm({ name: "", target: "", current: "", targetDate: "", category: "Saving" });
  };

  const handleDelete = (id) => update(d => ({ ...d, goals: d.goals.filter(g => g.id !== id) }));

  const handleCurrentUpdate = (id, val) => {
    update(d => ({ ...d, goals: d.goals.map(g => g.id === id ? { ...g, current: parseFloat(val) || g.current } : g) }));
  };

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: "1.5rem" }}>
        <div>
          <h1 style={{ fontSize: 22, fontWeight: 500, margin: "0 0 4px" }}>Goals</h1>
          <p style={{ color: "var(--color-text-secondary)", margin: 0, fontSize: 14 }}>Track what you're building toward</p>
        </div>
        <button onClick={() => setModal(true)} style={{ padding: "8px 16px", borderRadius: "var(--border-radius-md)", background: "#22c55e", color: "#fff", border: "none", cursor: "pointer", fontSize: 13 }}>
          + Add goal
        </button>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(300px, 1fr))", gap: "1rem" }}>
        {data.goals.map(g => {
          // Use live bucket balance if linked, otherwise use stored current
          const liveBalance = liveBucketBalance(g.bucketKey);
          const current = liveBalance !== null ? liveBalance : g.current;
          const isComplete = current >= g.target;
          const p = Math.min((current / g.target) * 100, 100);
          const weeksLeft = g.targetDate ? Math.max(0, Math.ceil((new Date(g.targetDate) - new Date()) / (7 * 86400000))) : null;
          const needed = weeksLeft ? Math.max(0, (g.target - current) / weeksLeft) : null;
          const onTrack = isComplete || (needed !== null && needed < 500);
          return (
            <div key={g.id} style={{ background: "var(--color-background-primary)", border: `0.5px solid ${isComplete ? "#bbf7d0" : "var(--color-border-tertiary)"}`, borderRadius: "var(--border-radius-lg)", padding: "1.25rem" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 12 }}>
                <div>
                  <p style={{ fontWeight: 500, margin: "0 0 2px", fontSize: 15 }}>{g.name}</p>
                  <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                    <p style={{ fontSize: 12, color: "var(--color-text-secondary)", margin: 0 }}>{g.category}</p>
                    {g.bucketKey && <span style={{ fontSize: 11, color: "#3b82f6", background: "#dbeafe", borderRadius: 99, padding: "1px 7px" }}>Live from bucket</span>}
                  </div>
                </div>
                <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                  <Badge label={isComplete ? "Complete!" : onTrack ? "On track" : "Needs attention"} color={isComplete ? "green" : onTrack ? "green" : "amber"} />
                  <button onClick={() => handleDelete(g.id)} style={{ background: "none", border: "none", cursor: "pointer", color: "var(--color-text-secondary)", fontSize: 16 }}>×</button>
                </div>
              </div>

              <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 8 }}>
                <span style={{ fontSize: 13, color: "var(--color-text-secondary)" }}>Progress</span>
                <span style={{ fontSize: 13, fontWeight: 500 }}>{fmt(current, 2)} / {fmt(g.target)}</span>
              </div>
              <ProgressBar pct={p} color={isComplete ? "#22c55e" : undefined} />
              <p style={{ fontSize: 12, color: "var(--color-text-secondary)", margin: "6px 0 0" }}>
                {isComplete ? "Goal achieved!" : `${p.toFixed(0)}% · ${fmt(g.target - current, 2)} to go`}
              </p>

              {!isComplete && weeksLeft !== null && (
                <p style={{ fontSize: 12, color: "var(--color-text-secondary)", marginTop: 4 }}>
                  Target: {fmtDate(g.targetDate)} · {weeksLeft} weeks · {fmt(needed)}/wk needed
                </p>
              )}

              {!g.bucketKey && (
                <div style={{ marginTop: 12, display: "flex", gap: 8, alignItems: "center" }}>
                  <input type="number" defaultValue={g.current} onBlur={e => handleCurrentUpdate(g.id, e.target.value)}
                    style={{ flex: 1, padding: "6px 10px", border: "0.5px solid var(--color-border-secondary)", borderRadius: "var(--border-radius-md)", fontSize: 13, background: "var(--color-background-primary)", color: "var(--color-text-primary)" }} />
                  <span style={{ fontSize: 12, color: "var(--color-text-secondary)", whiteSpace: "nowrap" }}>Update balance</span>
                </div>
              )}
            </div>
          );
        })}
      </div>

      {modal && (
        <Modal title="Add goal" onClose={() => setModal(false)}>
          <Input label="Goal name" value={form.name} onChange={v => setForm(p => ({ ...p, name: v }))} placeholder="e.g. Home deposit" />
          <Select label="Category" value={form.category} onChange={v => setForm(p => ({ ...p, category: v }))} options={["Property", "Investing", "Safety", "Lifestyle", "Travel", "Education", "Other"].map(c => ({ value: c, label: c }))} />
          <Input label="Target amount (AUD)" type="number" value={form.target} onChange={v => setForm(p => ({ ...p, target: v }))} />
          <Input label="Current amount (AUD)" type="number" value={form.current} onChange={v => setForm(p => ({ ...p, current: v }))} />
          <Input label="Target date" type="date" value={form.targetDate} onChange={v => setForm(p => ({ ...p, targetDate: v }))} />
          <button onClick={handleAdd} style={{ width: "100%", padding: "10px", borderRadius: "var(--border-radius-md)", background: "#22c55e", color: "#fff", border: "none", cursor: "pointer", fontSize: 14, fontWeight: 500 }}>
            Create goal
          </button>
        </Modal>
      )}
    </div>
  );
}

// ========= PROJECTIONS =========
function Projections({ data }) {
  const [editing, setEditing] = useState(false);
  const [params, setParams] = useState({
    weeklyIncome: 1000,
    weeklySpend: 400,
    weeklyInvest: 200,
    weeklyDeposit: 200,
    annualReturn: data.settings.annualReturn,
    savingsRate: data.settings.savingsRate,
    years: 5,
  });
  const [draft, setDraft] = useState({ ...params });

  const last = MONTHLY_DATA[MONTHLY_DATA.length - 1];
  const portfolioNow = data.portfolio.reduce((s, h) => s + h.units * h.price, 0);
  const netWorthNow = last.total;

  const setD = (k, v) => setDraft(p => ({ ...p, [k]: parseFloat(v) || 0 }));

  const applyDraft = () => { setParams({ ...draft }); setEditing(false); };
  const cancelEdit = () => { setDraft({ ...params }); setEditing(false); };

  const project = () => {
    const weeks = params.years * 52;
    const weeklyReturn = params.annualReturn / 100 / 52;
    const weeklyInterest = params.savingsRate / 100 / 52;
    const points = [];
    let invest = portfolioNow, cash = netWorthNow, deposit = data.startingBalances.homeDeposit;
    for (let w = 0; w <= weeks; w += 4) {
      invest = invest * (1 + weeklyReturn * 4) + params.weeklyInvest * 4;
      cash = cash * (1 + weeklyInterest * 4) + (params.weeklyIncome - params.weeklySpend - params.weeklyInvest - params.weeklyDeposit) * 4;
      deposit = deposit + params.weeklyDeposit * 4;
      points.push({ w, invest: Math.round(invest), cash: Math.round(Math.max(cash, 0)), deposit: Math.round(deposit), net: Math.round(invest + Math.max(cash, 0) + deposit) });
    }
    return points;
  };

  const pts = project();
  const final = pts[pts.length - 1];
  const milestones = [50000, 100000, 250000, 500000];

  const milestoneHits = milestones.map(m => {
    const hit = pts.find(p => p.net >= m);
    if (!hit) return { amount: m, date: null };
    const date = new Date();
    date.setDate(date.getDate() + hit.w * 7);
    return { amount: m, date: date.toLocaleDateString("en-AU", { month: "short", year: "numeric" }) };
  });

  // Chart with proper left padding for labels
  const W = 620, H = 220, PAD_L = 70, PAD_T = 16, PAD_B = 28;
  const CW = W - PAD_L;
  const maxVal = Math.max(...pts.map(p => p.net), 1);
  const toY = (v) => PAD_T + (1 - v / maxVal) * (H - PAD_T - PAD_B);
  const toX = (i) => PAD_L + (i / (pts.length - 1)) * CW;
  const linePoints = (key) => pts.map((p, i) => `${toX(i).toFixed(1)},${toY(p[key]).toFixed(1)}`).join(" ");

  const FIELDS = [
    { label: "Weekly income (AUD)", key: "weeklyIncome", step: "1" },
    { label: "Weekly spending (AUD)", key: "weeklySpend", step: "1" },
    { label: "Weekly investment (AUD)", key: "weeklyInvest", step: "1" },
    { label: "Weekly home deposit (AUD)", key: "weeklyDeposit", step: "1" },
    { label: "Annual investment return (%)", key: "annualReturn", step: "0.1" },
    { label: "Savings interest rate (%)", key: "savingsRate", step: "0.1" },
    { label: "Projection years", key: "years", step: "1" },
  ];

  return (
    <div>
      {/* Header */}
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: "1.25rem" }}>
        <div>
          <h1 style={{ fontSize: 22, fontWeight: 500, margin: "0 0 4px" }}>Wealth projections</h1>
          <p style={{ color: "var(--color-text-secondary)", margin: 0, fontSize: 14 }}>See where you could be headed — adjust the assumptions to explore different scenarios</p>
        </div>
        <button onClick={() => setEditing(e => !e)}
          style={{ padding: "8px 16px", borderRadius: "var(--border-radius-md)", background: editing ? "var(--color-background-secondary)" : "#3b82f6", color: editing ? "var(--color-text-primary)" : "#fff", border: "0.5px solid var(--color-border-secondary)", cursor: "pointer", fontSize: 13, fontWeight: 500, whiteSpace: "nowrap" }}>
          {editing ? "Cancel" : "Edit parameters"}
        </button>
      </div>

      {/* Disclaimer */}
      <div style={{ background: "#fefce8", border: "0.5px solid #fde047", borderRadius: "var(--border-radius-md)", padding: "10px 16px", marginBottom: "1.25rem", display: "flex", gap: 10, alignItems: "flex-start" }}>
        <span style={{ fontSize: 16, flexShrink: 0 }}>*</span>
        <p style={{ fontSize: 12, color: "#854d0e", margin: 0, lineHeight: 1.6 }}>
          These projections are estimates only and are not financial advice or a guarantee of future returns. Investment returns vary, markets go up and down, and your circumstances may change. The figures shown assume consistent contributions and a fixed annual return — real outcomes will differ. Always consider speaking with a licensed financial adviser before making investment decisions.
        </p>
      </div>

      {/* Edit panel */}
      {editing && (
        <div style={{ background: "var(--color-background-primary)", border: "1.5px solid #3b82f6", borderRadius: "var(--border-radius-lg)", padding: "1.25rem", marginBottom: "1.25rem" }}>
          <h3 style={{ fontSize: 14, fontWeight: 500, margin: "0 0 16px" }}>Adjust projection parameters</h3>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "0 1.5rem" }}>
            {FIELDS.map(f => (
              <div key={f.key} style={{ marginBottom: "1rem" }}>
                <label style={{ display: "block", fontSize: 12, color: "var(--color-text-secondary)", marginBottom: 4 }}>{f.label}</label>
                <input type="number" value={draft[f.key]} onChange={e => setD(f.key, e.target.value)} step={f.step}
                  style={{ width: "100%", boxSizing: "border-box", padding: "7px 10px", border: "0.5px solid var(--color-border-secondary)", borderRadius: "var(--border-radius-md)", fontSize: 14, background: "var(--color-background-primary)", color: "var(--color-text-primary)" }} />
              </div>
            ))}
          </div>
          <div style={{ display: "flex", gap: 10, marginTop: 4 }}>
            <button onClick={applyDraft} style={{ flex: 1, padding: "9px", borderRadius: "var(--border-radius-md)", background: "#22c55e", color: "#fff", border: "none", cursor: "pointer", fontSize: 14, fontWeight: 500 }}>
              Apply and update projection
            </button>
            <button onClick={cancelEdit} style={{ padding: "9px 16px", borderRadius: "var(--border-radius-md)", background: "none", border: "0.5px solid var(--color-border-secondary)", cursor: "pointer", fontSize: 14, color: "var(--color-text-secondary)" }}>
              Cancel
            </button>
          </div>
        </div>
      )}

      {/* Current params summary */}
      {!editing && (
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: "1.25rem" }}>
          {FIELDS.map(f => (
            <div key={f.key} style={{ background: "var(--color-background-secondary)", borderRadius: "var(--border-radius-md)", padding: "6px 12px", fontSize: 12 }}>
              <span style={{ color: "var(--color-text-secondary)" }}>{f.label.replace(" (AUD)", "").replace(" (%)", "")}  </span>
              <strong>{params[f.key]}{f.key.includes("Return") || f.key.includes("Rate") ? "%" : f.key === "years" ? "y" : ""}</strong>
            </div>
          ))}
        </div>
      )}

      {/* Outcome cards */}
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(130px, 1fr))", gap: 10, marginBottom: "1.25rem" }}>
        {[
          { label: `Net worth in ${params.years}y`, value: fmt(final?.net), color: "#22c55e" },
          { label: "Portfolio value", value: fmt(final?.invest), color: "#3b82f6" },
          { label: "Cash savings", value: fmt(final?.cash), color: "var(--color-text-primary)" },
          { label: "Home deposit", value: fmt(final?.deposit), color: "#8b5cf6" },
          { label: "Total growth", value: "+" + fmt((final?.net || 0) - netWorthNow), color: "#22c55e" },
          { label: "Growth %", value: "+" + (((final?.net - netWorthNow) / netWorthNow) * 100).toFixed(0) + "%", color: "#22c55e" },
        ].map(c => (
          <div key={c.label} style={{ background: "var(--color-background-secondary)", borderRadius: "var(--border-radius-md)", padding: "12px" }}>
            <p style={{ fontSize: 11, color: "var(--color-text-secondary)", margin: "0 0 4px", textTransform: "uppercase", letterSpacing: "0.04em" }}>{c.label}</p>
            <p style={{ fontSize: 17, fontWeight: 500, margin: 0, color: c.color }}>{c.value}</p>
          </div>
        ))}
      </div>

      {/* Chart */}
      <div style={{ background: "var(--color-background-primary)", border: "0.5px solid var(--color-border-tertiary)", borderRadius: "var(--border-radius-lg)", padding: "1.25rem", marginBottom: "1.25rem" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
          <h3 style={{ fontSize: 14, fontWeight: 500, margin: 0 }}>Projected net worth over {params.years} years</h3>
          <div style={{ display: "flex", gap: 14, fontSize: 11, color: "var(--color-text-secondary)" }}>
            {[["Net worth","#22c55e",""],["Portfolio","#3b82f6","6 3"],["Home deposit","#8b5cf6","3 3"]].map(([l,col,dash]) => (
              <span key={l} style={{ display: "flex", alignItems: "center", gap: 5 }}>
                <svg width="16" height="8"><line x1="0" y1="4" x2="16" y2="4" stroke={col} strokeWidth="2" strokeDasharray={dash} /></svg>{l}
              </span>
            ))}
          </div>
        </div>
        <svg viewBox={`0 0 ${W} ${H}`} width="100%" height={H} style={{ overflow: "visible" }}>
          {/* y-axis grid lines and labels — labels sit LEFT of PAD_L, lines start AT PAD_L */}
          {[0, 0.25, 0.5, 0.75, 1].map(r => {
            const yPx = toY(maxVal * r);
            return (
              <g key={r}>
                <line x1={PAD_L} y1={yPx} x2={W} y2={yPx} stroke="var(--color-border-tertiary)" strokeWidth="0.5" />
                <text x={PAD_L - 6} y={yPx + 3} fontSize={9} fill="var(--color-text-secondary)" textAnchor="end">{fmt(maxVal * r)}</text>
              </g>
            );
          })}
          {/* Milestone dashed lines */}
          {milestones.map(m => {
            const y = toY(m);
            if (y < PAD_T || y > H - PAD_B) return null;
            return <line key={m} x1={PAD_L} y1={y} x2={W} y2={y} stroke="#f59e0b" strokeWidth="0.5" strokeDasharray="4 4" />;
          })}
          {/* Lines */}
          <polyline points={linePoints("net")} fill="none" stroke="#22c55e" strokeWidth="2.5" strokeLinejoin="round" />
          <polyline points={linePoints("invest")} fill="none" stroke="#3b82f6" strokeWidth="1.5" strokeDasharray="6 3" strokeLinejoin="round" />
          <polyline points={linePoints("deposit")} fill="none" stroke="#8b5cf6" strokeWidth="1.5" strokeDasharray="3 3" strokeLinejoin="round" />
          {/* x-axis year labels */}
          {Array.from({ length: params.years + 1 }, (_, i) => {
            const ptIdx = Math.round((i / params.years) * (pts.length - 1));
            const x = toX(ptIdx);
            const yr = new Date().getFullYear() + i;
            return <text key={i} x={x} y={H + 14} fontSize={9} fill="var(--color-text-secondary)" textAnchor="middle">{yr}</text>;
          })}
        </svg>
      </div>

      {/* Milestones */}
      <div style={{ background: "var(--color-background-primary)", border: "0.5px solid var(--color-border-tertiary)", borderRadius: "var(--border-radius-lg)", padding: "1.25rem" }}>
        <h3 style={{ fontSize: 14, fontWeight: 500, margin: "0 0 12px" }}>Milestone estimates</h3>
        <p style={{ fontSize: 12, color: "var(--color-text-secondary)", margin: "0 0 14px" }}>Based on current parameters — estimates only, not guaranteed.</p>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(130px, 1fr))", gap: 10 }}>
          {milestoneHits.map(m => (
            <div key={m.amount} style={{ background: "var(--color-background-secondary)", borderRadius: "var(--border-radius-md)", padding: "12px" }}>
              <p style={{ fontSize: 11, color: "var(--color-text-secondary)", margin: "0 0 6px", textTransform: "uppercase" }}>Reach {fmt(m.amount)}</p>
              {m.date
                ? <p style={{ fontSize: 15, fontWeight: 500, margin: 0, color: "#22c55e" }}>{m.date}</p>
                : <p style={{ fontSize: 13, fontWeight: 500, margin: 0, color: "var(--color-text-secondary)" }}>Beyond {params.years} years</p>
              }
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ========= EOFY CARD =========
function EofyCard({ data, update }) {
  const hasPay = data.pay && data.pay.gross > 0;
  const [open, setOpen] = useState(false);
  const [saved, setSaved] = useState(false);
  const [form, setForm] = useState({
    fy: data.pay?.fy || "2024-25",
    employer: data.pay?.employer || "",
    gross: data.pay?.gross || "",
    tax: data.pay?.taxes || "",
    superSgc: data.pay?.super || "",
    dividends: data.pay?.dividends || "",
    interest: data.pay?.interest || "",
    otherIncome: data.pay?.otherIncome || "",
    medicareLevySurcharge: data.pay?.medicareLevySurcharge || "",
    hecs: data.pay?.hecs || "",
    offset: data.pay?.offset || "",
  });
  const setF = (k, v) => setForm(p => ({ ...p, [k]: v }));

  const net = (() => {
    const g = parseFloat(form.gross) || 0;
    const t = parseFloat(form.tax) || 0;
    const mls = parseFloat(form.medicareLevySurcharge) || 0;
    const h = parseFloat(form.hecs) || 0;
    return g - t - mls - h;
  })();

  const taxRate = (() => {
    const g = parseFloat(form.gross) || 0;
    const t = parseFloat(form.tax) || 0;
    return g > 0 ? (t / g) * 100 : 0;
  })();

  const totalIncome = (parseFloat(form.gross) || 0) + (parseFloat(form.dividends) || 0) + (parseFloat(form.interest) || 0) + (parseFloat(form.otherIncome) || 0);

  const handleSave = () => {
    update(d => ({
      ...d,
      pay: {
        fy: form.fy,
        employer: form.employer,
        gross: parseFloat(form.gross) || 0,
        net,
        taxes: parseFloat(form.tax) || 0,
        super: parseFloat(form.superSgc) || 0,
        dividends: parseFloat(form.dividends) || 0,
        interest: parseFloat(form.interest) || 0,
        otherIncome: parseFloat(form.otherIncome) || 0,
        medicareLevySurcharge: parseFloat(form.medicareLevySurcharge) || 0,
        hecs: parseFloat(form.hecs) || 0,
        offset: parseFloat(form.offset) || 0,
        taxPct: parseFloat(form.gross) > 0 ? (parseFloat(form.tax) || 0) / parseFloat(form.gross) : 0,
      },
    }));
    setSaved(true);
    setOpen(false);
    setTimeout(() => setSaved(false), 2500);
  };

  const fields = [
    { key: "fy", label: "Financial year", placeholder: "e.g. 2024-25", hint: "Top of your payment summary", text: true },
    { key: "employer", label: "Employer name", placeholder: "e.g. Acme Pty Ltd", hint: "As shown on your income statement", text: true },
    { key: "gross", label: "Gross income", placeholder: "0.00", hint: "Label 1 — Total gross payments" },
    { key: "tax", label: "Tax withheld", placeholder: "0.00", hint: "Label 2 — Total tax withheld" },
    { key: "superSgc", label: "Employer super (SGC)", placeholder: "0.00", hint: "Label 12 — Reportable employer super" },
    { key: "dividends", label: "Dividends", placeholder: "0.00", hint: "From dividend statements / myTax pre-fill" },
    { key: "interest", label: "Interest income", placeholder: "0.00", hint: "From bank statements / myTax pre-fill" },
    { key: "otherIncome", label: "Other income", placeholder: "0.00", hint: "Rental, freelance, other assessable income" },
    { key: "medicareLevySurcharge", label: "Medicare levy surcharge", placeholder: "0.00", hint: "If applicable — no private hospital cover" },
    { key: "hecs", label: "HECS / HELP repayment", placeholder: "0.00", hint: "From your notice of assessment" },
    { key: "offset", label: "Low income tax offset (LITO)", placeholder: "0.00", hint: "ATO calculates automatically — optional" },
  ];

  const summaryCards = [
    { label: "Gross income", value: fmt(data.pay.gross || 0), color: "var(--color-text-primary)" },
    { label: "Tax withheld", value: fmt(data.pay.taxes || 0), color: "#ef4444" },
    { label: "Net income", value: fmt(data.pay.net || 0), color: "#22c55e" },
    { label: "Super (SGC)", value: fmt(data.pay.super || 0), color: "#8b5cf6" },
    { label: "Effective tax rate", value: pct((data.pay.taxPct || 0) * 100), color: "var(--color-text-primary)" },
    { label: "Total income", value: fmt((data.pay.gross || 0) + (data.pay.dividends || 0) + (data.pay.interest || 0) + (data.pay.otherIncome || 0)), color: "#3b82f6" },
  ];

  const extras = [
    data.pay.dividends > 0 && { label: "Dividends", value: fmt(data.pay.dividends) },
    data.pay.interest > 0 && { label: "Interest income", value: fmt(data.pay.interest) },
    data.pay.otherIncome > 0 && { label: "Other income", value: fmt(data.pay.otherIncome) },
    data.pay.hecs > 0 && { label: "HECS repayment", value: fmt(data.pay.hecs) },
    data.pay.medicareLevySurcharge > 0 && { label: "Medicare levy surcharge", value: fmt(data.pay.medicareLevySurcharge) },
  ].filter(Boolean);

  return (
    <div style={{ background: "var(--color-background-primary)", border: "0.5px solid var(--color-border-tertiary)", borderRadius: "var(--border-radius-lg)", padding: "1.25rem", marginBottom: "1.5rem" }}>
      {!open && !hasPay && (
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 16, flexWrap: "wrap" }}>
          <div>
            <p style={{ fontSize: 14, fontWeight: 500, margin: "0 0 4px" }}>Add your income details — if you would like</p>
            <p style={{ fontSize: 13, color: "var(--color-text-secondary)", margin: 0 }}>
              Got your EOFY payment summary handy? Pop the numbers in and we will track your tax rate, net pay, and super automatically.
            </p>
          </div>
          <button onClick={() => setOpen(true)} style={{ padding: "8px 18px", borderRadius: "var(--border-radius-md)", background: "var(--color-background-secondary)", border: "0.5px solid var(--color-border-secondary)", cursor: "pointer", fontSize: 13, fontWeight: 500, color: "var(--color-text-primary)", whiteSpace: "nowrap" }}>
            Add income details
          </button>
        </div>
      )}

      {!open && hasPay && (
        <>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
            <div>
              <h3 style={{ fontSize: 14, fontWeight: 500, margin: "0 0 2px" }}>Annual income {data.pay.fy ? "FY " + data.pay.fy : ""}</h3>
              {data.pay.employer && <p style={{ fontSize: 12, color: "var(--color-text-secondary)", margin: 0 }}>{data.pay.employer}</p>}
            </div>
            <button onClick={() => { setOpen(true); setForm({ fy: data.pay.fy || "", employer: data.pay.employer || "", gross: data.pay.gross || "", tax: data.pay.taxes || "", superSgc: data.pay.super || "", dividends: data.pay.dividends || "", interest: data.pay.interest || "", otherIncome: data.pay.otherIncome || "", medicareLevySurcharge: data.pay.medicareLevySurcharge || "", hecs: data.pay.hecs || "", offset: data.pay.offset || "" }); }}
              style={{ fontSize: 12, color: "var(--color-text-secondary)", background: "none", border: "0.5px solid var(--color-border-tertiary)", borderRadius: "var(--border-radius-md)", padding: "4px 12px", cursor: "pointer" }}>
              Edit
            </button>
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(130px, 1fr))", gap: 10, marginBottom: extras.length ? 14 : 0 }}>
            {summaryCards.map(c => (
              <div key={c.label} style={{ background: "var(--color-background-secondary)", borderRadius: "var(--border-radius-md)", padding: "10px 12px" }}>
                <p style={{ fontSize: 11, color: "var(--color-text-secondary)", margin: "0 0 4px", textTransform: "uppercase", letterSpacing: "0.04em" }}>{c.label}</p>
                <p style={{ fontSize: 17, fontWeight: 500, margin: 0, color: c.color }}>{c.value}</p>
              </div>
            ))}
          </div>
          {extras.length > 0 && (
            <div style={{ borderTop: "0.5px solid var(--color-border-tertiary)", paddingTop: 12 }}>
              {extras.map(r => (
                <div key={r.label} style={{ display: "flex", justifyContent: "space-between", padding: "5px 0", fontSize: 13 }}>
                  <span style={{ color: "var(--color-text-secondary)" }}>{r.label}</span>
                  <span style={{ fontWeight: 500 }}>{r.value}</span>
                </div>
              ))}
            </div>
          )}
        </>
      )}

      {open && (
        <div>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
            <div>
              <h3 style={{ fontSize: 14, fontWeight: 500, margin: "0 0 2px" }}>EOFY income details</h3>
              <p style={{ fontSize: 12, color: "var(--color-text-secondary)", margin: 0 }}>Fill in from your payment summary or myTax pre-fill</p>
            </div>
            <button onClick={() => setOpen(false)} style={{ background: "none", border: "none", cursor: "pointer", fontSize: 20, color: "var(--color-text-secondary)", lineHeight: 1 }}>x</button>
          </div>

          {parseFloat(form.gross) > 0 && (
            <div style={{ display: "flex", gap: 16, flexWrap: "wrap", marginBottom: 16, padding: "10px 14px", background: "var(--color-background-secondary)", borderRadius: "var(--border-radius-md)" }}>
              <span style={{ fontSize: 12, color: "var(--color-text-secondary)" }}>Total income <strong style={{ color: "var(--color-text-primary)" }}>{fmt(totalIncome)}</strong></span>
              <span style={{ fontSize: 12, color: "var(--color-text-secondary)" }}>Est. net <strong style={{ color: "#22c55e" }}>{fmt(net)}</strong></span>
              <span style={{ fontSize: 12, color: "var(--color-text-secondary)" }}>Tax rate <strong style={{ color: "#ef4444" }}>{taxRate.toFixed(1)}%</strong></span>
            </div>
          )}

          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "0 1rem" }}>
            {fields.map(f => (
              <div key={f.key} style={{ marginBottom: "1rem" }}>
                <label style={{ display: "block", fontSize: 12, fontWeight: 500, color: "var(--color-text-primary)", marginBottom: 2 }}>{f.label}</label>
                <p style={{ fontSize: 11, color: "var(--color-text-secondary)", margin: "0 0 5px" }}>{f.hint}</p>
                <input
                  type={f.text ? "text" : "number"}
                  value={form[f.key]}
                  onChange={e => setF(f.key, e.target.value)}
                  placeholder={f.placeholder}
                  step="0.01"
                  style={{ width: "100%", boxSizing: "border-box", padding: "7px 10px", borderRadius: "var(--border-radius-md)", border: "0.5px solid var(--color-border-secondary)", fontSize: 13, background: "var(--color-background-primary)", color: "var(--color-text-primary)" }}
                />
              </div>
            ))}
          </div>

          <div style={{ display: "flex", gap: 10, marginTop: 4 }}>
            <button onClick={handleSave} style={{ flex: 1, padding: "9px", borderRadius: "var(--border-radius-md)", background: "#22c55e", color: "#fff", border: "none", cursor: "pointer", fontSize: 14, fontWeight: 500 }}>
              Save income details
            </button>
            <button onClick={() => setOpen(false)} style={{ padding: "9px 16px", borderRadius: "var(--border-radius-md)", background: "none", border: "0.5px solid var(--color-border-secondary)", cursor: "pointer", fontSize: 14, color: "var(--color-text-secondary)" }}>
              Cancel
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

// ========= SETTINGS =========
function Settings({ data, update }) {
  const [allocs, setAllocs] = useState({ ...data.settings.allocations });
  const [saved, setSaved] = useState(false);

  const total = Object.values(allocs).reduce((s, v) => s + parseFloat(v || 0), 0);

  const saveSettings = () => {
    update(d => ({ ...d, settings: { ...d.settings, allocations: Object.fromEntries(Object.entries(allocs).map(([k, v]) => [k, parseFloat(v) || 0])) } }));
    setSaved(true);
    setTimeout(() => setSaved(false), 2500);
  };

  return (
    <div>
      <div style={{ marginBottom: "1.5rem" }}>
        <h1 style={{ fontSize: 22, fontWeight: 500, margin: "0 0 4px" }}>Settings</h1>
        <p style={{ color: "var(--color-text-secondary)", margin: 0, fontSize: 14 }}>Customise how your money is allocated</p>
      </div>

      {/* ICOE goal banner */}
      <div style={{ background: "#f0fdf4", border: "0.5px solid #bbf7d0", borderRadius: "var(--border-radius-lg)", padding: "1rem 1.25rem", marginBottom: "1.25rem", display: "flex", alignItems: "center", gap: 12 }}>
        <span style={{ fontSize: 22 }}>🎯</span>
        <div>
          <p style={{ fontSize: 13, fontWeight: 500, color: "#166534", margin: "0 0 2px" }}>ICOE goal achieved — Emergency fund complete</p>
          <p style={{ fontSize: 12, color: "#15803d", margin: 0 }}>You hit your ~$8,000 ICOE target (roughly 6 months of support). That allocation is now $0 — your full paycheck goes to the buckets below.</p>
        </div>
      </div>

      <div style={{ background: "var(--color-background-primary)", border: "0.5px solid var(--color-border-tertiary)", borderRadius: "var(--border-radius-lg)", padding: "1.25rem", marginBottom: "1.5rem" }}>
        <h3 style={{ fontSize: 14, fontWeight: 500, margin: "0 0 4px" }}>Weekly income allocation (%)</h3>
        <p style={{ fontSize: 13, color: "var(--color-text-secondary)", margin: "0 0 16px" }}>These percentages determine how each paycheck is split. Total: <strong style={{ color: total === 100 ? "#22c55e" : "#ef4444" }}>{total.toFixed(1)}%</strong></p>
        {Object.entries(allocs).map(([k, v]) => {
          const labelMap = { expense: "Expense", homeDeposit: "Home deposit", stock: "Stock / investing", nowFun: "Now fun", laterFun: "Later fun", spare: "Spare" };
          return (
          <div key={k} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
            <label style={{ fontSize: 14, flex: 1 }}>{labelMap[k] || k}</label>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <input type="range" min={0} max={60} step={0.5} value={v}
                onChange={e => setAllocs(p => ({ ...p, [k]: parseFloat(e.target.value) }))}
                style={{ width: 120 }} />
              <span style={{ fontSize: 14, fontWeight: 500, minWidth: 40, textAlign: "right" }}>{parseFloat(v).toFixed(1)}%</span>
            </div>
          </div>
          );
        })}
        <button onClick={saveSettings}
          style={{ marginTop: 8, padding: "8px 20px", borderRadius: "var(--border-radius-md)", background: saved ? "#22c55e" : "var(--color-background-secondary)", border: "0.5px solid var(--color-border-secondary)", cursor: "pointer", fontSize: 14, fontWeight: 500, color: saved ? "#fff" : "var(--color-text-primary)" }}>
          {saved ? "✓ Saved" : "Save allocations"}
        </button>
      </div>

      <EofyCard data={data} update={update} />

      <div style={{ background: "var(--color-background-primary)", border: "0.5px solid var(--color-border-tertiary)", borderRadius: "var(--border-radius-lg)", padding: "1.25rem" }}>
        <h3 style={{ fontSize: 14, fontWeight: 500, margin: "0 0 12px" }}>Starting balances</h3>
        {Object.entries(data.startingBalances).map(([k, v]) => (
          <div key={k} style={{ display: "flex", justifyContent: "space-between", padding: "6px 0", borderBottom: "0.5px solid var(--color-border-tertiary)" }}>
            <span style={{ fontSize: 13, color: "var(--color-text-secondary)", textTransform: "capitalize" }}>{k.replace(/([A-Z])/g, " $1")}</span>
            <span style={{ fontSize: 13, fontWeight: 500 }}>{fmt(v, 2)}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

// ========= BUCKETS =========
function Buckets({ data }) {
  const BUCKETS = [
    { key: "icoe",       label: "ICOE",          color: "#22c55e", desc: "Emergency fund — 6 months of support" },
    { key: "expense",    label: "Expense",        color: "#ef4444", desc: "Regular bills and living costs" },
    { key: "homeDeposit",label: "Home deposit",   color: "#8b5cf6", desc: "Saving toward your first home" },
    { key: "stock",      label: "Stock & Crypto", color: "#3b82f6", desc: "Investments in shares and crypto" },
    { key: "nowFun",     label: "Now fun",        color: "#ec4899", desc: "Money to enjoy right now" },
    { key: "laterFun",   label: "Later fun",      color: "#a855f7", desc: "Saving for future experiences" },
    { key: "spare",      label: "Spare",          color: "#14b8a6", desc: "Buffer for unexpected costs" },
  ];

  const allocs = data.settings.allocations;
  const totalIncome = data.incomeEntries.reduce((s, e) => s + e.net, 0);
  const avgWeekly = data.incomeEntries.length ? totalIncome / data.incomeEntries.length : 0;

  // Snapshot date — balances already include all history up to this date
  const SNAPSHOT = "2026-05-14";
  const bucketData = BUCKETS.map(b => {
    const start    = data.startingBalances[b.key] || 0;
    const allocPct = allocs[b.key] || 0;
    // Only count income and expenses entered AFTER the snapshot
    const newIncome = data.incomeEntries.filter(e => e.date > SNAPSHOT).reduce((s, e) => s + e.net, 0);
    const allocated = (newIncome * allocPct) / 100;
    const spent    = data.expenses.filter(e => e.bucket === b.key && e.date > SNAPSHOT).reduce((s, e) => s + e.amount, 0);
    const balance  = start + allocated - spent;
    const weeklyAdd = (avgWeekly * allocPct) / 100;
    return { ...b, start, allocPct, allocated, spent, balance, weeklyAdd };
  });

  const totalBalance = bucketData.reduce((s, b) => s + b.balance, 0);

  // Now Fun uses saved cash check result if available, otherwise falls back to bucket calc
  const cashCheck = data.lastCashCheck;
  const nowFunBucket = bucketData.find(b => b.key === "nowFun");
  const nowFunDisplay = cashCheck?.nowFunAvailable != null ? cashCheck.nowFunAvailable : nowFunBucket?.balance;
  const hasCashCheck = cashCheck?.nowFunAvailable != null;

  return (
    <div>
      <div style={{ marginBottom: "1.5rem" }}>
        <h1 style={{ fontSize: 22, fontWeight: 500, margin: "0 0 4px" }}>Buckets</h1>
        <p style={{ color: "var(--color-text-secondary)", margin: 0, fontSize: 14 }}>Your running totals — starting balance plus all income allocations minus spending</p>
      </div>

      {/* Now Fun hero — most important number */}
      {nowFunDisplay != null && (
        <div style={{ background: nowFunDisplay >= 0 ? "#fdf2f8" : "#fef2f2", border: `1.5px solid ${nowFunDisplay >= 0 ? "#ec4899" : "#fecaca"}`, borderRadius: "var(--border-radius-lg)", padding: "1.25rem 1.5rem", marginBottom: "1.25rem" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
            <div>
              <p style={{ fontSize: 11, color: nowFunDisplay >= 0 ? "#9d174d" : "#991b1b", margin: "0 0 4px", textTransform: "uppercase", letterSpacing: "0.07em" }}>
                Now fun — {hasCashCheck ? "available to spend" : "bucket balance"}
              </p>
              <p style={{ fontSize: 40, fontWeight: 500, margin: "0 0 4px", letterSpacing: "-1px", color: nowFunDisplay >= 0 ? "#ec4899" : "#ef4444" }}>{fmt(nowFunDisplay, 2)}</p>
              <p style={{ fontSize: 12, color: nowFunDisplay >= 0 ? "#9d174d" : "#991b1b", margin: 0 }}>
                {hasCashCheck
                  ? `From cash check on ${fmtDate(cashCheck.date)} — total cash ${fmt(cashCheck.totalCash, 2)} minus all committed buckets`
                  : "Do a cash check in Weekly Update to see your real spending money"}
              </p>
            </div>
            <span style={{ fontSize: 32, opacity: 0.3 }}>&#9829;</span>
          </div>
        </div>
      )}

      {/* Total cash card */}
      <div style={{ background: "var(--color-background-primary)", border: "0.5px solid var(--color-border-tertiary)", borderRadius: "var(--border-radius-lg)", padding: "1.25rem 1.5rem", marginBottom: "1.25rem", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <div>
          <p style={{ fontSize: 12, color: "var(--color-text-secondary)", margin: "0 0 4px", textTransform: "uppercase", letterSpacing: "0.06em" }}>Total across all buckets</p>
          <p style={{ fontSize: 32, fontWeight: 500, margin: 0, letterSpacing: "-0.5px" }}>{fmt(totalBalance, 2)}</p>
        </div>
        <div style={{ display: "flex", height: 44, width: 110, gap: 2, alignItems: "flex-end" }}>
          {bucketData.map(b => {
            const h = Math.max(4, (Math.max(b.balance, 0) / Math.max(totalBalance, 1)) * 44);
            return <div key={b.key} style={{ flex: 1, height: h, background: b.color, borderRadius: "2px 2px 0 0", opacity: 0.85 }} title={b.label} />;
          })}
        </div>
      </div>

      {/* Bucket cards */}
      <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: "1.25rem" }}>
        {bucketData.map(b => {
          // Now Fun shows cash-check value if available
          const displayBalance = (b.key === "nowFun" && hasCashCheck) ? cashCheck.nowFunAvailable : b.balance;
          const pos = displayBalance >= 0;
          const pctOfTotal = totalBalance > 0 ? (Math.max(displayBalance, 0) / totalBalance) * 100 : 0;
          const isNowFun = b.key === "nowFun";
          return (
            <div key={b.key} style={{ background: "var(--color-background-primary)", border: `0.5px solid ${isNowFun && hasCashCheck ? "#ec4899" : "var(--color-border-tertiary)"}`, borderRadius: "var(--border-radius-lg)", padding: "1rem 1.25rem" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 10 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                  <span style={{ width: 12, height: 12, borderRadius: 3, background: b.color, flexShrink: 0, marginTop: 2 }} />
                  <div>
                    <p style={{ fontSize: 14, fontWeight: 500, margin: "0 0 2px" }}>{b.label}</p>
                    <p style={{ fontSize: 11, color: "var(--color-text-secondary)", margin: 0 }}>
                      {isNowFun && hasCashCheck ? "From latest cash check" : b.desc}
                    </p>
                  </div>
                </div>
                <div style={{ textAlign: "right" }}>
                  <p style={{ fontSize: 22, fontWeight: 500, margin: "0 0 2px", color: pos ? (isNowFun ? "#ec4899" : "var(--color-text-primary)") : "#ef4444" }}>{fmt(displayBalance, 2)}</p>
                  <p style={{ fontSize: 11, color: "var(--color-text-secondary)", margin: 0 }}>{pctOfTotal.toFixed(1)}% of total</p>
                </div>
              </div>
              <div style={{ background: "var(--color-background-tertiary)", borderRadius: 99, height: 4, overflow: "hidden" }}>
                <div style={{ width: `${Math.min(pctOfTotal, 100)}%`, height: "100%", background: b.color, borderRadius: 99 }} />
              </div>
            </div>
          );
        })}
      </div>

      {!hasCashCheck && (
        <div style={{ background: "var(--color-background-secondary)", borderRadius: "var(--border-radius-md)", padding: "12px 16px", fontSize: 13, color: "var(--color-text-secondary)" }}>
          Tip: do a cash check in Weekly Update to see your real Now Fun spending money based on your actual cash balance.
        </div>
      )}
    </div>
  );
}


// ========= MONTHLY CLOSE =========
function MonthlyClose({ data, update }) {
  const lastReport = data.monthlyReports?.[data.monthlyReports.length - 1];
  const prevStockTotal = lastReport?.stockTotal ?? MONTHLY_DATA[MONTHLY_DATA.length - 1].stock;
  const prevGoldTotal  = lastReport?.goldTotal  ?? MONTHLY_DATA[MONTHLY_DATA.length - 1].gold;
  const prevCryptoTotal = lastReport?.cryptoTotal ?? MONTHLY_DATA[MONTHLY_DATA.length - 1].crypto;
  const prevNetTotal   = lastReport?.netTotal    ?? MONTHLY_DATA[MONTHLY_DATA.length - 1].total;

  const thisMonth = new Date().toISOString().slice(0, 7);
  const defaultLabel = (() => {
    const [y, m] = thisMonth.split("-");
    return new Date(+y, +m - 1, 1).toLocaleDateString("en-AU", { month: "short", year: "2-digit" }).replace(" ", "-");
  })();

  const [month, setMonth] = useState(thisMonth);
  const [stockTotal, setStockTotal] = useState("");
  const [goldTotal, setGoldTotal] = useState("");
  const [cryptoTotal, setCryptoTotal] = useState("");
  const [cashTotal, setCashTotal] = useState("");
  const [saved, setSaved] = useState(false);
  const [activeTab, setActiveTab] = useState("stocks");

  // Pull stock/crypto spending from expenses bucket this month
  const stockSpentThisMonth = data.expenses
    .filter(e => e.date.startsWith(month) && e.bucket === "stock")
    .reduce((s, e) => s + e.amount, 0);

  // Calc metrics when values entered
  const sTotal = parseFloat(stockTotal) || 0;
  const gTotal = parseFloat(goldTotal) || 0;
  const cTotal = parseFloat(cryptoTotal) || 0;
  const cashT  = parseFloat(cashTotal) || 0;

  const stockDiff      = sTotal - prevStockTotal;
  const stockGrowth    = stockDiff - stockSpentThisMonth;
  const stockGrowthPct = prevStockTotal > 0 ? (stockGrowth / prevStockTotal) * 100 : 0;
  const prevStockProfit = data.monthlyReports.reduce((s, r) => s + (r.stockGrowth || 0), 0);
  const totalStockProfit = prevStockProfit + stockGrowth;

  const goldDiff      = gTotal - prevGoldTotal;
  const goldGrowthPct = prevGoldTotal > 0 ? (goldDiff / prevGoldTotal) * 100 : 0;

  const cryptoDiff      = cTotal - prevCryptoTotal;
  const cryptoGrowthPct = prevCryptoTotal > 0 ? (cryptoDiff / prevCryptoTotal) * 100 : 0;

  const investGrowth = stockGrowth + goldDiff + cryptoDiff;
  const newTotal     = (sTotal || prevStockTotal) + (gTotal || prevGoldTotal) + (cTotal || prevCryptoTotal) + cashT;
  const balanceGrowth = newTotal - prevNetTotal;
  const growthPct     = prevNetTotal > 0 ? (balanceGrowth / prevNetTotal) * 100 : 0;

  const handleSave = () => {
    if (!stockTotal && !goldTotal && !cryptoTotal) return;
    const report = {
      id: Date.now(),
      month,
      label: defaultLabel,
      stockTotal: sTotal || prevStockTotal,
      goldTotal:  gTotal || prevGoldTotal,
      cryptoTotal: cTotal || prevCryptoTotal,
      cashTotal:  cashT,
      stockSpent: stockSpentThisMonth,
      stockGrowth,
      stockGrowthPct: parseFloat(stockGrowthPct.toFixed(2)),
      totalStockProfit: parseFloat(totalStockProfit.toFixed(2)),
      goldGrowth: goldDiff,
      goldGrowthPct: parseFloat(goldGrowthPct.toFixed(2)),
      cryptoGrowth: cryptoDiff,
      cryptoGrowthPct: parseFloat(cryptoGrowthPct.toFixed(2)),
      investGrowth: parseFloat(investGrowth.toFixed(2)),
      netTotal: parseFloat(newTotal.toFixed(2)),
      balanceGrowth: parseFloat(balanceGrowth.toFixed(2)),
      growthPct: parseFloat(growthPct.toFixed(2)),
    };
    update(d => ({ ...d, monthlyReports: [...(d.monthlyReports || []), report] }));
    setSaved(true);
    setTimeout(() => setSaved(false), 2500);
    setStockTotal(""); setGoldTotal(""); setCryptoTotal(""); setCashTotal("");
  };

  const handleDelete = (id) => update(d => ({ ...d, monthlyReports: d.monthlyReports.filter(r => r.id !== id) }));

  const GreenRed = ({ v, suffix = "" }) => (
    <span style={{ color: v >= 0 ? "#22c55e" : "#ef4444", fontWeight: 500 }}>
      {v >= 0 ? "+" : ""}{fmt(v, 2)}{suffix}
    </span>
  );

  const TabBtn = ({ id, label }) => (
    <button onClick={() => setActiveTab(id)} style={{ padding: "7px 16px", borderRadius: "var(--border-radius-md)", border: "none", cursor: "pointer", fontSize: 13, fontWeight: activeTab === id ? 500 : 400, background: activeTab === id ? "#3b82f6" : "var(--color-background-secondary)", color: activeTab === id ? "#fff" : "var(--color-text-secondary)" }}>
      {label}
    </button>
  );

  return (
    <div>
      <div style={{ marginBottom: "1.5rem" }}>
        <h1 style={{ fontSize: 22, fontWeight: 500, margin: "0 0 4px" }}>Monthly close</h1>
        <p style={{ color: "var(--color-text-secondary)", margin: 0, fontSize: 14 }}>Report your end-of-month asset values and lock in your growth figures</p>
      </div>

      {/* Tabs */}
      <div style={{ display: "flex", gap: 8, marginBottom: "1.25rem", flexWrap: "wrap" }}>
        <TabBtn id="stocks" label="Stocks" />
        <TabBtn id="gold" label="Gold" />
        <TabBtn id="crypto" label="Crypto" />
        <TabBtn id="summary" label="Monthly summary" />
        <TabBtn id="history" label="History" />
      </div>

      {/* Month picker */}
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: "1.25rem" }}>
        <label style={{ fontSize: 13, color: "var(--color-text-secondary)" }}>Reporting month</label>
        <input type="month" value={month} onChange={e => setMonth(e.target.value)}
          style={{ padding: "6px 10px", border: "0.5px solid var(--color-border-secondary)", borderRadius: "var(--border-radius-md)", fontSize: 13, background: "var(--color-background-primary)", color: "var(--color-text-primary)" }} />
        <span style={{ fontSize: 12, color: "var(--color-text-secondary)" }}>Previous total: stocks {fmt(prevStockTotal)} · gold {fmt(prevGoldTotal)} · crypto {fmt(prevCryptoTotal, 2)}</span>
      </div>

      {/* STOCKS TAB */}
      {activeTab === "stocks" && (
        <div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "1rem", marginBottom: "1.25rem" }}>
            <div style={{ background: "var(--color-background-primary)", border: "0.5px solid var(--color-border-tertiary)", borderRadius: "var(--border-radius-lg)", padding: "1.25rem" }}>
              <h3 style={{ fontSize: 14, fontWeight: 500, margin: "0 0 16px" }}>Enter stock total</h3>
              <div style={{ marginBottom: "1rem" }}>
                <label style={{ display: "block", fontSize: 12, color: "var(--color-text-secondary)", marginBottom: 4 }}>Total stock value this month (AUD)</label>
                <input type="number" value={stockTotal} onChange={e => setStockTotal(e.target.value)} placeholder={fmt(prevStockTotal, 2)} step="0.01"
                  style={{ width: "100%", padding: "8px 12px", border: "0.5px solid var(--color-border-secondary)", borderRadius: "var(--border-radius-md)", fontSize: 14, background: "var(--color-background-primary)", color: "var(--color-text-primary)" }} />
              </div>
              <div style={{ fontSize: 12, color: "var(--color-text-secondary)", background: "var(--color-background-secondary)", borderRadius: "var(--border-radius-md)", padding: "10px 12px" }}>
                <p style={{ margin: "0 0 4px" }}>Stock/crypto spent this month (from expenses): <strong style={{ color: "#3b82f6" }}>{fmt(stockSpentThisMonth, 2)}</strong></p>
                <p style={{ margin: 0, fontSize: 11 }}>This is automatically pulled from your Stock & Crypto expense bucket for {defaultLabel}</p>
              </div>

            <div style={{ background: "var(--color-background-primary)", border: "0.5px solid var(--color-border-tertiary)", borderRadius: "var(--border-radius-lg)", padding: "1.25rem" }}>

              {sTotal > 0 ? (
                <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                  {[
                    { label: "Previous total", value: fmt(prevStockTotal, 2), plain: true },
                    { label: "New total", value: fmt(sTotal, 2), plain: true },
                    { label: "Total change (incl. contributions)", value: <GreenRed v={stockDiff} />, plain: false },
                    { label: "Stock spent this month", value: fmt(stockSpentThisMonth, 2), plain: true },

                    { label: "Growth %", value: <GreenRed v={stockGrowthPct} suffix="%" /> },
