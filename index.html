            <div style={{ marginBottom: "1rem" }}>
              <label style={{ display: "block", fontSize: 12, color: "var(--color-text-secondary)", marginBottom: 4 }}>Total crypto value this month (AUD)</label>
              <input type="number" value={cryptoTotal} onChange={e => setCryptoTotal(e.target.value)} placeholder={fmt(prevCryptoTotal, 2)} step="0.01"
                style={{ width: "100%", padding: "8px 12px", border: "0.5px solid var(--color-border-secondary)", borderRadius: "var(--border-radius-md)", fontSize: 14, background: "var(--color-background-primary)", color: "var(--color-text-primary)" }} />
            </div>
            <p style={{ fontSize: 12, color: "var(--color-text-secondary)", margin: 0 }}>Previous month: <strong>{fmt(prevCryptoTotal, 2)}</strong></p>
          </div>
          <div style={{ background: "var(--color-background-primary)", border: "0.5px solid var(--color-border-tertiary)", borderRadius: "var(--border-radius-lg)", padding: "1.25rem" }}>
            <h3 style={{ fontSize: 14, fontWeight: 500, margin: "0 0 16px" }}>Crypto performance</h3>
            {cTotal > 0 ? (
              <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                {[
                  { label: "Previous total", value: fmt(prevCryptoTotal, 2) },
                  { label: "New total", value: fmt(cTotal, 2) },
                  { label: "Growth", value: <GreenRed v={cryptoDiff} /> },
                  { label: "Growth %", value: <GreenRed v={cryptoGrowthPct} suffix="%" /> },
                ].map((r, i) => (
                  <div key={i} style={{ display: "flex", justifyContent: "space-between", fontSize: 13, padding: "5px 0", borderBottom: "0.5px solid var(--color-border-tertiary)" }}>
                    <span style={{ color: "var(--color-text-secondary)" }}>{r.label}</span>
                    <span>{r.value}</span>
                  </div>
                ))}
              </div>
            ) : <p style={{ color: "var(--color-text-secondary)", fontSize: 13 }}>Enter your crypto value to see performance.</p>}
            {data.monthlyReports?.length > 0 && (
              <div style={{ marginTop: 16 }}>
                <p style={{ fontSize: 12, fontWeight: 500, marginBottom: 8 }}>Crypto history</p>
                {data.monthlyReports.map(r => (
                  <div key={r.id} style={{ display: "flex", justifyContent: "space-between", fontSize: 12, padding: "4px 0", borderBottom: "0.5px solid var(--color-border-tertiary)" }}>
                    <span style={{ color: "var(--color-text-secondary)" }}>{r.label}</span>
                    <span>{fmt(r.cryptoTotal, 2)}</span>
                    <span style={{ color: r.cryptoGrowth >= 0 ? "#22c55e" : "#ef4444" }}>{r.cryptoGrowth >= 0 ? "+" : ""}{fmt(r.cryptoGrowth, 2)}</span>
                    <span style={{ color: r.cryptoGrowthPct >= 0 ? "#22c55e" : "#ef4444" }}>{r.cryptoGrowthPct?.toFixed(2)}%</span>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      )}

      {/* SUMMARY TAB */}
      {activeTab === "summary" && (
        <div>
          <div style={{ background: "var(--color-background-primary)", border: "0.5px solid var(--color-border-tertiary)", borderRadius: "var(--border-radius-lg)", padding: "1.25rem", marginBottom: "1.25rem" }}>
            <h3 style={{ fontSize: 14, fontWeight: 500, margin: "0 0 4px" }}>End of month summary — {defaultLabel}</h3>
            <p style={{ fontSize: 12, color: "var(--color-text-secondary)", margin: "0 0 16px" }}>Fill in stocks, gold and crypto tabs first, then add your total cash to lock in the month.</p>

            <div style={{ marginBottom: 16 }}>
              <label style={{ display: "block", fontSize: 12, color: "var(--color-text-secondary)", marginBottom: 4 }}>Total cash this month (AUD) — all buckets combined</label>
              <input type="number" value={cashTotal} onChange={e => setCashTotal(e.target.value)} placeholder="e.g. 21495.97" step="0.01"
                style={{ width: "100%", padding: "8px 12px", border: "0.5px solid var(--color-border-secondary)", borderRadius: "var(--border-radius-md)", fontSize: 14, background: "var(--color-background-primary)", color: "var(--color-text-primary)" }} />
            </div>

            <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 16 }}>
              {[
                { label: "Stocks", value: sTotal || prevStockTotal, prev: prevStockTotal },
                { label: "Gold", value: gTotal || prevGoldTotal, prev: prevGoldTotal },
                { label: "Crypto", value: cTotal || prevCryptoTotal, prev: prevCryptoTotal },
                { label: "Cash", value: cashT, prev: null },
              ].map(r => (
                <div key={r.label} style={{ display: "flex", justifyContent: "space-between", fontSize: 13, padding: "6px 0", borderBottom: "0.5px solid var(--color-border-tertiary)" }}>
                  <span style={{ color: "var(--color-text-secondary)" }}>{r.label}</span>
                  <span style={{ fontWeight: 500 }}>{fmt(r.value, 2)}</span>
                </div>
              ))}
              <div style={{ display: "flex", justifyContent: "space-between", fontSize: 14, padding: "8px 0", fontWeight: 500 }}>
                <span>New total</span>
                <span style={{ color: "#22c55e" }}>{fmt(newTotal, 2)}</span>
              </div>
              <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13 }}>
                <span style={{ color: "var(--color-text-secondary)" }}>Balance change from {lastReport?.label || "May-26"}</span>
                <GreenRed v={balanceGrowth} />
              </div>
              <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13 }}>
                <span style={{ color: "var(--color-text-secondary)" }}>Growth %</span>
                <GreenRed v={growthPct} suffix="%" />
              </div>
              <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13 }}>
                <span style={{ color: "var(--color-text-secondary)" }}>Investment growth (market only)</span>
                <GreenRed v={investGrowth} />
              </div>
            </div>

            <button onClick={handleSave} disabled={!sTotal && !gTotal && !cTotal}
              style={{ width: "100%", padding: "10px", borderRadius: "var(--border-radius-md)", background: saved ? "#22c55e" : (sTotal || gTotal || cTotal) ? "#3b82f6" : "var(--color-background-secondary)", color: saved ? "#fff" : (sTotal || gTotal || cTotal) ? "#fff" : "var(--color-text-secondary)", border: "none", cursor: "pointer", fontSize: 14, fontWeight: 500 }}>
              {saved ? "✓ Month locked in — charts updated!" : "Lock in this month"}
            </button>
          </div>
        </div>
      )}

      {/* HISTORY TAB */}
      {activeTab === "history" && (
        <div style={{ background: "var(--color-background-primary)", border: "0.5px solid var(--color-border-tertiary)", borderRadius: "var(--border-radius-lg)", padding: "1.25rem" }}>
          <h3 style={{ fontSize: 14, fontWeight: 500, margin: "0 0 16px" }}>All monthly reports</h3>
          {data.monthlyReports?.length === 0 ? (
            <p style={{ color: "var(--color-text-secondary)", fontSize: 13 }}>No reports yet. Complete a monthly close to see your history here.</p>
          ) : (
            <div style={{ overflowX: "auto" }}>
              <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12 }}>
                <thead>
                  <tr style={{ borderBottom: "0.5px solid var(--color-border-tertiary)" }}>
                    {["Month", "Stocks", "Gold", "Crypto", "Cash", "Total", "Inv. growth", "Balance Δ", "Growth %", ""].map((h, i) => (
                      <th key={i} style={{ padding: "5px 8px", fontWeight: 500, color: "var(--color-text-secondary)", textAlign: i === 0 ? "left" : "right", whiteSpace: "nowrap" }}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {data.monthlyReports.map(r => (
                    <tr key={r.id} style={{ borderBottom: "0.5px solid var(--color-border-tertiary)" }}>
                      <td style={{ padding: "7px 8px", fontWeight: 500 }}>{r.label}</td>
                      <td style={{ padding: "7px 8px", textAlign: "right" }}>{fmt(r.stockTotal, 2)}</td>
                      <td style={{ padding: "7px 8px", textAlign: "right" }}>{fmt(r.goldTotal, 2)}</td>
                      <td style={{ padding: "7px 8px", textAlign: "right" }}>{fmt(r.cryptoTotal, 2)}</td>
                      <td style={{ padding: "7px 8px", textAlign: "right" }}>{fmt(r.cashTotal, 2)}</td>
                      <td style={{ padding: "7px 8px", textAlign: "right", fontWeight: 500 }}>{fmt(r.netTotal, 2)}</td>
                      <td style={{ padding: "7px 8px", textAlign: "right", color: r.investGrowth >= 0 ? "#22c55e" : "#ef4444" }}>{r.investGrowth >= 0 ? "+" : ""}{fmt(r.investGrowth, 2)}</td>
                      <td style={{ padding: "7px 8px", textAlign: "right", color: r.balanceGrowth >= 0 ? "#22c55e" : "#ef4444" }}>{r.balanceGrowth >= 0 ? "+" : ""}{fmt(r.balanceGrowth, 2)}</td>
                      <td style={{ padding: "7px 8px", textAlign: "right", fontWeight: 500, color: r.growthPct >= 0 ? "#22c55e" : "#ef4444" }}>{r.growthPct >= 0 ? "+" : ""}{r.growthPct?.toFixed(2)}%</td>
                      <td style={{ padding: "7px 8px" }}>
                        <button onClick={() => handleDelete(r.id)} style={{ background: "none", border: "none", cursor: "pointer", color: "var(--color-text-secondary)", fontSize: 14 }}>×</button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </div>
      )}
    </div>
  );
}



// ========= SETUP WIZARD =========

function SetupField({ label, children }) {
  return (
    <div style={{ marginBottom: 12 }}>
      <label style={{ display: "block", fontSize: 12, color: "var(--color-text-secondary)", marginBottom: 4 }}>{label}</label>
      {children}
    </div>
  );
}

function SetupWizard({ data, update, dbHelpers, onFinish, onCancel }) {
  const [step, setStep] = useState(0);
  const [payFrequency, setPayFrequency] = useState(data.pay?.payFrequency || "weekly");
  const [regularPayAmount, setRegularPayAmount] = useState(data.pay?.regularPayAmount || "");
  const [nextPayDate, setNextPayDate] = useState(data.pay?.nextPayDate || todayISO());
  const [expenses, setExpenses] = useState(data.pay?.recurringExpenses?.length ? data.pay.recurringExpenses : [
    { id: Date.now(), name: "Rent", category: "Rent", amount: "", frequency: "weekly", nextCharge: todayISO(), bucket: "expense" }
  ]);
  const [allocs, setAllocs] = useState({ ...data.settings.allocations });
  const [totalCash, setTotalCash] = useState("");
  const [bucketBalances, setBucketBalances] = useState({ ...data.startingBalances });
  const [assets, setAssets] = useState(data.portfolio?.length ? data.portfolio : [
    { id: Date.now(), asset: "", type: "ETF", units: "", price: "", costBasis: "" }
  ]);
  const [saving, setSaving] = useState(false);

  const steps = ["Pay cycle", "Regular expenses", "Pay allocation", "Cash buckets", "Assets"];
  const payAmount = parseFloat(regularPayAmount) || 0;
  const totalAlloc = Object.values(allocs).reduce((s, v) => s + (parseFloat(v) || 0), 0);
  const billsPerPay = expenses.reduce((s, e) => s + toPerPayAmount(e.amount, e.frequency, payFrequency), 0);
  const weeklyBills = expenses.reduce((s, e) => s + toWeeklyAmount(e.amount, e.frequency), 0);
  const flexiblePerPay = Math.max(0, payAmount - billsPerPay - (payAmount * (((parseFloat(allocs.homeDeposit)||0) + (parseFloat(allocs.stock)||0) + (parseFloat(allocs.laterFun)||0) + (parseFloat(allocs.icoe)||0)) / 100)));

  const addExpense = () => setExpenses(prev => [...prev, { id: Date.now() + Math.random(), name: "", category: "Subscription", amount: "", frequency: "monthly", nextCharge: todayISO(), bucket: "expense" }]);
  const updateExpense = (id, key, value) => setExpenses(prev => prev.map(e => e.id === id ? { ...e, [key]: value } : e));
  const removeExpense = (id) => setExpenses(prev => prev.filter(e => e.id !== id));

  const addAsset = () => setAssets(prev => [...prev, { id: Date.now() + Math.random(), asset: "", type: "ETF", units: "", price: "", costBasis: "" }]);
  const updateAsset = (id, key, value) => setAssets(prev => prev.map(a => a.id === id ? { ...a, [key]: value } : a));
  const removeAsset = (id) => setAssets(prev => prev.filter(a => a.id !== id));

  const setBucket = (key, value) => setBucketBalances(prev => ({ ...prev, [key]: value }));
  const cashBucketTotal = BUCKET_KEYS_GLOBAL.reduce((s, key) => s + (parseFloat(bucketBalances[key]) || 0), 0);

  const finishSetup = async () => {
    setSaving(true);
    const cleanExpenses = expenses
      .filter(e => e.name || parseFloat(e.amount) > 0)
      .map(e => ({ ...e, amount: parseFloat(e.amount) || 0 }));
    const cleanAssets = assets
      .filter(a => a.asset && (parseFloat(a.units) || 0) > 0)
      .map(a => ({
        id: typeof a.id === "number" ? a.id : Date.now() + Math.random(),
        asset: a.asset,
        type: a.type || "Other",
        units: parseFloat(a.units) || 0,
        price: parseFloat(a.price) || 0,
        costBasis: parseFloat(a.costBasis) || 0,
      }));
    const balances = Object.fromEntries(Object.entries(bucketBalances).map(([k, v]) => [k, parseFloat(v) || 0]));
    const assetTotal = cleanAssets.reduce((s, a) => s + a.units * a.price, 0);
    balances.total = cashBucketTotal + assetTotal;
    balances.gold = cleanAssets.filter(a => (a.type || "").toLowerCase().includes("gold") || (a.asset || "").toLowerCase().includes("gold")).reduce((s, a) => s + a.units * a.price, 0);
    balances.isSnapshot = true;

    update(d => ({
      ...d,
      settings: { ...d.settings, allocations: Object.fromEntries(Object.entries(allocs).map(([k, v]) => [k, parseFloat(v) || 0])) },
      startingBalances: { ...d.startingBalances, ...balances },
      portfolio: cleanAssets,
      pay: {
        ...d.pay,
        payFrequency,
        regularPayAmount: payAmount,
        nextPayDate,
        recurringExpenses: cleanExpenses,
        onboardingComplete: true,
      },
      goals: (d.goals || []).map(g => ({ ...g, current: g.bucketKey ? (balances[g.bucketKey] || 0) : g.current }))
    }));

    if (dbHelpers?.savePortfolioItem) {
      for (const a of cleanAssets) {
        if (!String(a.id).includes("-")) {
          try { await dbHelpers.savePortfolioItem(a); } catch (e) {}
        }
      }
    }
    setSaving(false);
    onFinish();
  };

  const inputStyle = { width: "100%", boxSizing: "border-box", padding: "8px 10px", borderRadius: "var(--border-radius-md)", border: "0.5px solid var(--color-border-secondary)", fontSize: 13, background: "var(--color-background-primary)", color: "var(--color-text-primary)" };
  const selectStyle = inputStyle;

  return (
    <div style={{ minHeight: "100vh", background: "var(--color-background-tertiary)", fontFamily: "var(--font-sans)", padding: "2rem 1rem" }}>
      <div style={{ maxWidth: 860, margin: "0 auto" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "1rem" }}>
          <div>
            <h1 style={{ fontSize: 24, fontWeight: 600, margin: "0 0 4px" }}>Set up your financial situation</h1>
            <p style={{ fontSize: 14, color: "var(--color-text-secondary)", margin: 0 }}>A quick setup flow so your dashboard, buckets, and projections start with useful numbers.</p>
          </div>
          <button onClick={onCancel} style={{ padding: "8px 14px", borderRadius: "var(--border-radius-md)", border: "0.5px solid var(--color-border-secondary)", background: "var(--color-background-primary)", cursor: "pointer", fontSize: 13 }}>Skip</button>
        </div>

        <div style={{ display: "flex", gap: 6, marginBottom: "1rem" }}>
          {steps.map((s, i) => <div key={s} style={{ flex: 1, height: 6, borderRadius: 99, background: i <= step ? "#22c55e" : "var(--color-border-tertiary)" }} />)}
        </div>

        <div style={{ background: "var(--color-background-primary)", border: "0.5px solid var(--color-border-tertiary)", borderRadius: "var(--border-radius-lg)", padding: "1.5rem", boxShadow: "0 8px 28px rgba(0,0,0,0.04)" }}>
          <p style={{ fontSize: 12, color: "var(--color-text-secondary)", textTransform: "uppercase", letterSpacing: "0.06em", margin: "0 0 4px" }}>Step {step + 1} of {steps.length}</p>
          <h2 style={{ fontSize: 18, fontWeight: 600, margin: "0 0 16px" }}>{steps[step]}</h2>

          {step === 0 && (
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "1rem" }}>
              <SetupField label="How often do you get paid?">
                <select value={payFrequency} onChange={e => setPayFrequency(e.target.value)} style={selectStyle}>
                  <option value="weekly">Weekly</option>
                  <option value="fortnightly">Fortnightly</option>
                </select>
              </SetupField>
              <SetupField label={`Usual ${payFrequency} take-home pay`}>
                <input type="number" value={regularPayAmount} onChange={e => setRegularPayAmount(e.target.value)} placeholder="e.g. 1050" step="0.01" style={inputStyle} />
              </SetupField>
              <SetupField label="Next pay date">
                <input type="date" value={nextPayDate} onChange={e => setNextPayDate(e.target.value)} style={inputStyle} />
              </SetupField>
              <div style={{ background: "var(--color-background-secondary)", borderRadius: "var(--border-radius-md)", padding: "12px" }}>
                <p style={{ fontSize: 12, color: "var(--color-text-secondary)", margin: "0 0 4px" }}>Equivalent weekly income</p>
                <p style={{ fontSize: 20, fontWeight: 600, margin: 0, color: "#22c55e" }}>{fmt(payFrequency === "fortnightly" ? payAmount / 2 : payAmount)}</p>
              </div>
            </div>
          )}

          {step === 1 && (
            <div>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(150px, 1fr))", gap: 10, marginBottom: 14 }}>
                <StatCard label={`Bills per ${payFrequency}`} value={fmt(billsPerPay)} sub="Based on charge frequency" color="#ef4444" />
                <StatCard label="Weekly equivalent" value={fmt(weeklyBills)} sub="For comparing expenses" color="#f59e0b" />
              </div>
              {expenses.map((e, idx) => (
                <div key={e.id} style={{ display: "grid", gridTemplateColumns: "1.2fr 1fr .8fr .9fr 1fr 32px", gap: 8, alignItems: "end", marginBottom: 10, padding: 10, background: "var(--color-background-secondary)", borderRadius: "var(--border-radius-md)" }}>
                  <SetupField label={idx === 0 ? "Expense name" : ""}><input value={e.name} onChange={ev => updateExpense(e.id, "name", ev.target.value)} placeholder="Netflix, rent, car loan" style={inputStyle} /></SetupField>
                  <SetupField label={idx === 0 ? "Category" : ""}><select value={e.category} onChange={ev => updateExpense(e.id, "category", ev.target.value)} style={selectStyle}>{["Subscription","Rent","Car payment","Insurance","Appliance","Debt repayment","Utilities","Other"].map(c => <option key={c} value={c}>{c}</option>)}</select></SetupField>
                  <SetupField label={idx === 0 ? "Amount" : ""}><input type="number" value={e.amount} onChange={ev => updateExpense(e.id, "amount", ev.target.value)} step="0.01" style={inputStyle} /></SetupField>
                  <SetupField label={idx === 0 ? "Charged" : ""}><select value={e.frequency} onChange={ev => updateExpense(e.id, "frequency", ev.target.value)} style={selectStyle}>{["weekly","fortnightly","monthly","quarterly","yearly"].map(f => <option key={f} value={f}>{f}</option>)}</select></SetupField>
                  <SetupField label={idx === 0 ? "Next charge" : ""}><input type="date" value={e.nextCharge} onChange={ev => updateExpense(e.id, "nextCharge", ev.target.value)} style={inputStyle} /></SetupField>
                  <button onClick={() => removeExpense(e.id)} style={{ height: 34, borderRadius: "var(--border-radius-md)", border: "none", background: "#fee2e2", color: "#b91c1c", cursor: "pointer" }}>×</button>
                </div>
              ))}
              <button onClick={addExpense} style={{ padding: "8px 14px", borderRadius: "var(--border-radius-md)", border: "0.5px solid var(--color-border-secondary)", background: "var(--color-background-primary)", cursor: "pointer", fontSize: 13 }}>+ Add another expense</button>
            </div>
          )}

          {step === 2 && (
            <div>
              <p style={{ fontSize: 13, color: "var(--color-text-secondary)", margin: "0 0 14px" }}>Choose how each paycheck should be split. This updates the app's allocation settings. Total should equal <strong style={{ color: totalAlloc === 100 ? "#22c55e" : "#ef4444" }}>{totalAlloc.toFixed(1)}%</strong>. Dollar amounts update live from your usual <strong>{payFrequency}</strong> pay of <strong>{fmt(payAmount)}</strong>.</p>

              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(150px, 1fr))", gap: 10, marginBottom: 14 }}>
                <StatCard label={`${payFrequency} pay`} value={fmt(payAmount)} color="#22c55e" />
                <StatCard label="Total allocated" value={fmt((payAmount * totalAlloc) / 100)} sub={`${totalAlloc.toFixed(1)}% of pay`} color={Math.abs(totalAlloc - 100) < 0.01 ? "#22c55e" : "#f59e0b"} />
                <StatCard label="Unallocated" value={fmt(payAmount - ((payAmount * totalAlloc) / 100))} sub="Aim for $0" color={Math.abs(totalAlloc - 100) < 0.01 ? "#22c55e" : "#ef4444"} />
                <StatCard label="Bills needed" value={fmt(billsPerPay)} sub={`Per ${payFrequency}`} color="#ef4444" />
              </div>

              {BUCKET_KEYS_GLOBAL.map(k => {
                const percent = parseFloat(allocs[k]) || 0;
                const dollars = (payAmount * percent) / 100;
                const isExpense = k === "expense";
                const expenseShortfall = isExpense ? dollars - billsPerPay : null;
                return (
                  <div key={k} style={{ display: "grid", gridTemplateColumns: "1.1fr 180px 82px 120px", alignItems: "center", gap: 12, marginBottom: 12, padding: "10px 12px", background: "var(--color-background-secondary)", borderRadius: "var(--border-radius-md)", border: isExpense && expenseShortfall < 0 ? "1px solid #fecaca" : "0.5px solid var(--color-border-tertiary)" }}>
                    <div>
                      <label style={{ fontSize: 14, fontWeight: 500 }}>{BUCKET_LABELS_GLOBAL[k]}</label>
                      {isExpense && (
                        <p style={{ fontSize: 11, color: expenseShortfall >= 0 ? "#15803d" : "#b91c1c", margin: "3px 0 0" }}>
                          {expenseShortfall >= 0 ? `${fmt(expenseShortfall)} buffer after bills` : `${fmt(Math.abs(expenseShortfall))} short for listed bills`}
                        </p>
                      )}
                    </div>
                    <input type="range" min="0" max="70" step="0.5" value={allocs[k] || 0} onChange={e => setAllocs(p => ({ ...p, [k]: parseFloat(e.target.value) }))} style={{ width: "100%" }} />
                    <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
                      <input type="number" value={allocs[k] || 0} onChange={e => setAllocs(p => ({ ...p, [k]: parseFloat(e.target.value) || 0 }))} step="0.5" style={{ ...inputStyle, width: 62, textAlign: "right" }} />
                      <span style={{ fontSize: 12, color: "var(--color-text-secondary)" }}>%</span>
                    </div>
                    <div style={{ textAlign: "right" }}>
                      <p style={{ fontSize: 15, fontWeight: 600, margin: 0, color: "var(--color-text-primary)" }}>{fmt(dollars)}</p>
                      <p style={{ fontSize: 11, color: "var(--color-text-secondary)", margin: "2px 0 0" }}>per pay</p>
                    </div>
                  </div>
                );
              })}

              <div style={{ marginTop: 12, display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(150px, 1fr))", gap: 10 }}>
                <StatCard label="Expense allocation" value={fmt((payAmount * ((parseFloat(allocs.expense) || 0) / 100)))} sub={`Bills: ${fmt(billsPerPay)}`} color={(payAmount * ((parseFloat(allocs.expense) || 0) / 100)) >= billsPerPay ? "#22c55e" : "#ef4444"} />
                <StatCard label="Goals/investing" value={fmt(payAmount * (((parseFloat(allocs.homeDeposit)||0) + (parseFloat(allocs.stock)||0) + (parseFloat(allocs.laterFun)||0) + (parseFloat(allocs.icoe)||0)) / 100))} sub="Home, investing, later fun, ICOE" color="#3b82f6" />
                <StatCard label="Flexible estimate" value={fmt(flexiblePerPay)} sub="After bills + key goals" color="#22c55e" />
              </div>
            </div>
          )}

          {step === 3 && (
            <div>
              <SetupField label="How much total cash do you currently have?">
                <input type="number" value={totalCash} onChange={e => setTotalCash(e.target.value)} placeholder="Optional total cash check" step="0.01" style={inputStyle} />
              </SetupField>
              <p style={{ fontSize: 13, color: "var(--color-text-secondary)", margin: "0 0 14px" }}>Allocate your current cash into buckets. This becomes your starting balance for the dashboard and buckets page.</p>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(180px, 1fr))", gap: "0 1rem" }}>
                {BUCKET_KEYS_GLOBAL.map(k => <SetupField key={k} label={BUCKET_LABELS_GLOBAL[k]}><input type="number" value={bucketBalances[k] || ""} onChange={e => setBucket(k, e.target.value)} step="0.01" style={inputStyle} /></SetupField>)}
              </div>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                <StatCard label="Allocated cash" value={fmt(cashBucketTotal)} color="#22c55e" />
                <StatCard label="Difference from total" value={totalCash ? fmt((parseFloat(totalCash)||0) - cashBucketTotal) : "—"} sub="Useful for checking buckets" color="#f59e0b" />
              </div>
            </div>
          )}

          {step === 4 && (
            <div>
              <p style={{ fontSize: 13, color: "var(--color-text-secondary)", margin: "0 0 14px" }}>Add assets you already have, such as ETFs, shares, crypto, physical gold, or savings assets. You can update these later in Portfolio.</p>
              {assets.map((a, idx) => (
                <div key={a.id} style={{ display: "grid", gridTemplateColumns: "1.2fr .8fr .7fr .8fr .8fr 32px", gap: 8, alignItems: "end", marginBottom: 10, padding: 10, background: "var(--color-background-secondary)", borderRadius: "var(--border-radius-md)" }}>
                  <SetupField label={idx === 0 ? "Asset" : ""}><input value={a.asset} onChange={e => updateAsset(a.id, "asset", e.target.value)} placeholder="e.g. VGS, Bitcoin" style={inputStyle} /></SetupField>
                  <SetupField label={idx === 0 ? "Type" : ""}><select value={a.type} onChange={e => updateAsset(a.id, "type", e.target.value)} style={selectStyle}>{["ETF","Stock","Crypto","Gold","Cash","Other"].map(t => <option key={t} value={t}>{t}</option>)}</select></SetupField>
                  <SetupField label={idx === 0 ? "Units" : ""}><input type="number" value={a.units} onChange={e => updateAsset(a.id, "units", e.target.value)} step="0.000001" style={inputStyle} /></SetupField>
                  <SetupField label={idx === 0 ? "Price" : ""}><input type="number" value={a.price} onChange={e => updateAsset(a.id, "price", e.target.value)} step="0.01" style={inputStyle} /></SetupField>
                  <SetupField label={idx === 0 ? "Cost basis" : ""}><input type="number" value={a.costBasis} onChange={e => updateAsset(a.id, "costBasis", e.target.value)} step="0.01" style={inputStyle} /></SetupField>
                  <button onClick={() => removeAsset(a.id)} style={{ height: 34, borderRadius: "var(--border-radius-md)", border: "none", background: "#fee2e2", color: "#b91c1c", cursor: "pointer" }}>×</button>
                </div>
              ))}
              <button onClick={addAsset} style={{ padding: "8px 14px", borderRadius: "var(--border-radius-md)", border: "0.5px solid var(--color-border-secondary)", background: "var(--color-background-primary)", cursor: "pointer", fontSize: 13 }}>+ Add another asset</button>
            </div>
          )}

          <div style={{ display: "flex", justifyContent: "space-between", gap: 10, marginTop: "1.5rem", paddingTop: "1rem", borderTop: "0.5px solid var(--color-border-tertiary)" }}>
            <button onClick={() => setStep(Math.max(0, step - 1))} disabled={step === 0} style={{ padding: "9px 16px", borderRadius: "var(--border-radius-md)", border: "0.5px solid var(--color-border-secondary)", background: step === 0 ? "var(--color-background-secondary)" : "var(--color-background-primary)", cursor: step === 0 ? "default" : "pointer", fontSize: 14, color: "var(--color-text-secondary)" }}>Back</button>
            {step < steps.length - 1 ? (
              <button onClick={() => setStep(step + 1)} style={{ padding: "9px 18px", borderRadius: "var(--border-radius-md)", border: "none", background: "#22c55e", color: "#fff", cursor: "pointer", fontSize: 14, fontWeight: 500 }}>Next</button>
            ) : (
              <button onClick={finishSetup} disabled={saving} style={{ padding: "9px 18px", borderRadius: "var(--border-radius-md)", border: "none", background: "#22c55e", color: "#fff", cursor: "pointer", fontSize: 14, fontWeight: 500 }}>{saving ? "Saving..." : "Finish setup"}</button>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

// ========= STARTUP CHOICE =========
function StartupChoice({ userEmail, onChooseUpdate, onChooseSaved, onSignOut }) {
  const CardButton = ({ title, subtitle, icon, onClick, primary }) => (
    <button onClick={onClick}
      style={{ textAlign: "left", width: "100%", padding: "1.25rem", borderRadius: "var(--border-radius-lg)", border: primary ? "1.5px solid #22c55e" : "0.5px solid var(--color-border-secondary)", background: primary ? "#f0fdf4" : "var(--color-background-primary)", cursor: "pointer", boxShadow: primary ? "0 8px 24px rgba(34,197,94,0.10)" : "0 4px 18px rgba(0,0,0,0.04)", transition: "transform 0.15s, box-shadow 0.15s" }}
      onMouseEnter={e => { e.currentTarget.style.transform = "translateY(-2px)"; e.currentTarget.style.boxShadow = "0 10px 28px rgba(0,0,0,0.08)"; }}
      onMouseLeave={e => { e.currentTarget.style.transform = "translateY(0)"; e.currentTarget.style.boxShadow = primary ? "0 8px 24px rgba(34,197,94,0.10)" : "0 4px 18px rgba(0,0,0,0.04)"; }}>
      <div style={{ display: "flex", alignItems: "flex-start", gap: 14 }}>
        <div style={{ width: 42, height: 42, borderRadius: 12, display: "flex", alignItems: "center", justifyContent: "center", background: primary ? "#dcfce7" : "var(--color-background-secondary)", fontSize: 22, flexShrink: 0 }}>{icon}</div>
        <div>
          <p style={{ margin: "0 0 5px", fontSize: 16, fontWeight: 600, color: "var(--color-text-primary)" }}>{title}</p>
          <p style={{ margin: 0, fontSize: 13, lineHeight: 1.45, color: "var(--color-text-secondary)" }}>{subtitle}</p>
        </div>
      </div>
    </button>
  );

  return (
    <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: "linear-gradient(135deg,#f0fdf4 0%,#eff6ff 100%)", padding: "1rem", fontFamily: "var(--font-sans)" }}>
      <div style={{ width: "100%", maxWidth: 560 }}>
        <div style={{ background: "rgba(255,255,255,0.9)", border: "0.5px solid var(--color-border-tertiary)", borderRadius: 20, padding: "2rem", boxShadow: "0 12px 40px rgba(0,0,0,0.08)" }}>
          <div style={{ textAlign: "center", marginBottom: "1.5rem" }}>
            <p style={{ fontSize: 28, fontWeight: 600, margin: "0 0 6px", letterSpacing: "-0.5px", color: "var(--color-text-primary)" }}>Welcome to WealthFlow</p>
            <p style={{ fontSize: 14, color: "var(--color-text-secondary)", margin: 0 }}>What would you like to do today?</p>
            {userEmail && <p style={{ fontSize: 12, color: "var(--color-text-secondary)", margin: "10px 0 0" }}>{userEmail}</p>}
          </div>

          <div style={{ display: "grid", gap: 12 }}>
            <CardButton
              primary
              icon="✨"
              title="Get started / update my financial situation"
              subtitle="Enter new income, expenses, portfolio changes, goals, or monthly updates before viewing your dashboard."
              onClick={onChooseUpdate}
            />
            <CardButton
              icon="📊"
              title="No updates — take me to my previously saved dashboard"
              subtitle="Skip the update flow and go straight to your saved overview, charts, goals, and projections."
              onClick={onChooseSaved}
            />
          </div>

          <button onClick={onSignOut} style={{ width: "100%", marginTop: 16, padding: "9px", borderRadius: "var(--border-radius-md)", background: "transparent", border: "none", cursor: "pointer", fontSize: 12, color: "var(--color-text-secondary)" }}>
            Sign out
          </button>
        </div>
      </div>
    </div>
  );
}

// ========= NAV =========
const PAGES = [
  { id: "home",         label: "Home",            icon: "ti-home" },
  { id: "setup",        label: "Setup wizard",    icon: "ti-calendar-plus" },
  { id: "dashboard",    label: "Charts",           icon: "ti-chart-bar" },
  { id: "weekly",       label: "Weekly update",    icon: "ti-calendar-plus" },
  { id: "monthly",      label: "Monthly close",    icon: "ti-calendar-event" },
  { id: "buckets",      label: "Buckets",          icon: "ti-stack-2" },
  { id: "expenses",     label: "Expenses",         icon: "ti-receipt" },
  { id: "portfolio",    label: "Portfolio",        icon: "ti-chart-line" },
  { id: "goals",        label: "Goals",            icon: "ti-target" },
  { id: "projections",  label: "Projections",      icon: "ti-trending-up" },
  { id: "settings",     label: "Settings",         icon: "ti-settings" },
];

function App({ data, update, dbHelpers, userEmail, onSignOut }) {
  // data and update come from props (Supabase-backed)
  const [page, setPage] = useState("home");
  const [menuOpen, setMenuOpen] = useState(false);
  const [showStartupChoice, setShowStartupChoice] = useState(true);

  const pages = { home: Home, setup: SetupWizard, dashboard: Dashboard, weekly: WeeklyUpdate, monthly: MonthlyClose, buckets: Buckets, expenses: Expenses, portfolio: Portfolio, goals: Goals, projections: Projections, settings: Settings };
  const PageComp = pages[page] || Dashboard;

  const chooseUpdateFlow = () => {
    setPage("setup");
    setShowStartupChoice(false);
  };

  const chooseSavedDashboard = () => {
    setPage("home");
    setShowStartupChoice(false);
  };

  if (showStartupChoice) {
    return <StartupChoice userEmail={userEmail} onChooseUpdate={chooseUpdateFlow} onChooseSaved={chooseSavedDashboard} onSignOut={onSignOut} />;
  }

  return (
    <div style={{ display: "flex", minHeight: "100vh", fontFamily: "var(--font-sans)", background: "var(--color-background-tertiary)" }}>
      {/* Sidebar */}
      <aside style={{ width: 220, background: "var(--color-background-primary)", borderRight: "0.5px solid var(--color-border-tertiary)", padding: "1.5rem 0", display: "flex", flexDirection: "column", flexShrink: 0, position: "sticky", top: 0, height: "100vh", overflow: "auto" }}>
        <div style={{ padding: "0 1.25rem 1.5rem", borderBottom: "0.5px solid var(--color-border-tertiary)", marginBottom: "0.75rem" }}>
          <p style={{ fontWeight: 500, fontSize: 16, margin: 0, color: "var(--color-text-primary)" }}>WealthFlow</p>
          <p style={{ fontSize: 12, color: "var(--color-text-secondary)", margin: "2px 0 0" }}>Personal finance tracker</p>
        </div>
        <nav>
          {PAGES.map(p => (
            <button key={p.id} onClick={() => setPage(p.id)}
              style={{ width: "100%", textAlign: "left", display: "flex", alignItems: "center", gap: 10, padding: "8px 1.25rem", border: "none", cursor: "pointer", fontSize: 13, fontWeight: page === p.id ? 500 : 400, background: page === p.id ? "var(--color-background-secondary)" : "transparent", color: page === p.id ? "var(--color-text-primary)" : "var(--color-text-secondary)", borderLeft: page === p.id ? "2px solid #22c55e" : "2px solid transparent", transition: "all 0.15s" }}>
              <span style={{ fontSize: 14, width: 18, textAlign: "center", flexShrink: 0 }}>{{"ti-home":"🏠","ti-chart-bar":"📊","ti-calendar-plus":"📅","ti-stack-2":"🪣","ti-receipt":"🧾","ti-chart-line":"📈","ti-target":"🎯","ti-trending-up":"📉","ti-settings":"⚙️"}[p.icon] || "•"}</span>
              {p.label}
            </button>
          ))}
        </nav>
        <div style={{ marginTop: "auto", padding: "1.25rem", borderTop: "0.5px solid var(--color-border-tertiary)" }}>
          <p style={{ fontSize: 11, color: "var(--color-text-secondary)", margin: "0 0 8px", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{userEmail}</p>
          <button onClick={onSignOut} style={{ width: "100%", padding: "6px", borderRadius: "var(--border-radius-md)", background: "none", border: "0.5px solid var(--color-border-secondary)", cursor: "pointer", fontSize: 12, color: "var(--color-text-secondary)" }}>
            Sign out
          </button>
        </div>
      </aside>

      {/* Main content */}
      <main style={{ flex: 1, padding: "2rem", maxWidth: 900, overflow: "auto" }}>
        <PageComp data={data} update={update} dbHelpers={dbHelpers} onFinish={() => setPage("home")} onCancel={() => setPage("home")} />
      </main>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<Root />);
</script>
</body>
</html>
