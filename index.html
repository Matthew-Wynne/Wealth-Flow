function AuthScreen({ onAuth }) {

  const [message, setMessage] = useState("");

  const inp = (val, set, type="text", ph="") => (
    <input type={type} value={val} onChange={e => set(e.target.value)} placeholder={ph}
      style={{ width:"100%", padding:"10px 14px", border:"0.5px solid #d1d5db", borderRadius:8, fontSize:14, marginBottom:12, background:"#fff", color:"#1a1a2e" }} />
  );

  const btn = (label, onClick, bg="#22c55e", disabled=false) => (

      style={{ width:"100%", padding:"11px", borderRadius:8, background: disabled ? "#d1d5db" : bg, color:"#fff", border:"none", cursor: disabled ? "default" : "pointer", fontSize:14, fontWeight:500, marginBottom:8 }}>
      {loading ? "Please wait..." : label}
    </button>
  );

  const handleLogin = async () => {
    setError(""); setLoading(true);
    const { error } = await supabase.auth.signInWithPassword({ email, password });
    setLoading(false);
    if (error) setError(error.message);
    else { const { data: { session } } = await supabase.auth.getSession(); onAuth(session); }
  };

  const handleSignup = async () => {
    setError("");
    if (password !== confirmPassword) { setError("Passwords do not match"); return; }
    if (password.length < 6) { setError("Password must be at least 6 characters"); return; }
    setLoading(true);
    const { error } = await supabase.auth.signUp({ email, password });
    setLoading(false);
    if (error) setError(error.message);
    else setMessage("Account created! Check your email to confirm, then log in.");
  };

  const card = (children) => (

  );

  if (mode === "landing") return card(
    <>

      </div>

        style={{ width:"100%", padding:"12px", borderRadius:8, background:"#22c55e", color:"#fff", border:"none", cursor:"pointer", fontSize:15, fontWeight:500, marginBottom:10 }}>

        style={{ width:"100%", padding:"12px", borderRadius:8, background:"transparent", color:"#22c55e", border:"1.5px solid #22c55e", cursor:"pointer", fontSize:15, fontWeight:500 }}>
        Create account

      <p style={{ fontSize:12, color:"#9ca3af", textAlign:"center", marginTop:20 }}>
        Your data is private and encrypted. Only you can access your account.

// ── Supabase data hook — replaces window.__wealthflowStore ───────────────────
function useData(userId) {
  const [data, setData] = useState(initialState);
  const [loading, setLoading] = useState(true);
  const saveTimer = useRef(null);

  // Load user settings from Supabase on mount
  useEffect(() => {
    if (!userId) return;
    (async () => {
      setLoading(true);
      const { data: rows } = await supabase
        .from("user_settings")
        .select("*")
        .eq("user_id", userId)
        .single();

      if (rows) {
        const saved = {
          ...initialState,
          settings: { ...initialState.settings, ...(rows.allocations ? { allocations: rows.allocations } : {}), allocations: rows.allocations || initialState.settings.allocations },
          startingBalances: rows.starting_balances || initialState.startingBalances,
          pay: { ...initialState.pay, ...(rows.pay || {}) },
          lastCashCheck: rows.last_cash_check || null,
          monthlyReports: rows.monthly_reports || [],
        };

        // Load income entries
        const { data: income } = await supabase.from("income_entries").select("*").eq("user_id", userId).order("date");
        const { data: expenses } = await supabase.from("expenses").select("*").eq("user_id", userId).order("date");
        const { data: portfolio } = await supabase.from("portfolio").select("*").eq("user_id", userId);

        saved.incomeEntries = (income || []).map(r => ({ id: r.id, date: r.date, gross: r.gross, net: r.net, source: r.source }));
        saved.expenses = (expenses || []).map(r => ({ id: r.id, date: r.date, amount: r.amount, bucket: r.bucket, category: r.category, description: r.description, notes: r.notes }));
        saved.portfolio = (portfolio || []).map(r => ({ id: r.id, asset: r.asset, type: r.type, units: r.units, price: r.price, costBasis: r.cost_basis }));

        setData(saved);
      } else {
        // New user — insert default settings row
        await supabase.from("user_settings").insert({
          user_id: userId,
          allocations: initialState.settings.allocations,
          starting_balances: initialState.startingBalances,
          monthly_reports: [],
          pay: initialState.pay,
        });
        setData(initialState);
      }
      setLoading(false);
    })();
  }, [userId]);

  const update = useCallback((fn) => {
    setData(prev => {
      const next = fn(prev);

      // Debounced save — 800ms after last change
      if (saveTimer.current) clearTimeout(saveTimer.current);
      saveTimer.current = setTimeout(async () => {
        // Save settings
        await supabase.from("user_settings").upsert({
          user_id: userId,
          allocations: next.settings.allocations,
          starting_balances: next.startingBalances,
          pay: next.pay,
          last_cash_check: next.lastCashCheck,
          monthly_reports: next.monthlyReports,
        }, { onConflict: "user_id" });
      }, 800);

      return next;
    });
  }, [userId]);

  // Separate savers for arrays (income, expenses, portfolio) that sync individually
  const saveIncome = useCallback(async (entry) => {
    await supabase.from("income_entries").insert({
      user_id: userId, date: entry.date, gross: entry.gross, net: entry.net, source: entry.source
    });
  }, [userId]);

  const deleteIncome = useCallback(async (id) => {
    await supabase.from("income_entries").delete().eq("id", id).eq("user_id", userId);
  }, [userId]);

  const saveExpense = useCallback(async (expense) => {
    const { data: row } = await supabase.from("expenses").insert({
      user_id: userId, date: expense.date, amount: expense.amount,
      bucket: expense.bucket, category: expense.category,
      description: expense.description || "", notes: expense.notes || ""
    }).select().single();
    return row;
  }, [userId]);

  const deleteExpense = useCallback(async (id) => {
    await supabase.from("expenses").delete().eq("id", id).eq("user_id", userId);
  }, [userId]);

  const savePortfolioItem = useCallback(async (item) => {
    const { data: row } = await supabase.from("portfolio").insert({
      user_id: userId, asset: item.asset, type: item.type,
      units: item.units, price: item.price, cost_basis: item.costBasis || 0
    }).select().single();
    return row;
  }, [userId]);

  const updatePortfolioItem = useCallback(async (id, changes) => {
    await supabase.from("portfolio").update({
      units: changes.units, price: changes.price, cost_basis: changes.costBasis
    }).eq("id", id).eq("user_id", userId);
  }, [userId]);

  const deletePortfolioItem = useCallback(async (id) => {
    await supabase.from("portfolio").delete().eq("id", id).eq("user_id", userId);
  }, [userId]);

  return { data, update, loading, saveIncome, deleteIncome, saveExpense, deleteExpense, savePortfolioItem, updatePortfolioItem, deletePortfolioItem };
}

// ── Root app with auth gate ───────────────────────────────────────────────────
function Root() {
  const [session, setSession] = useState(undefined); // undefined = loading

  useEffect(() => {
    supabase.auth.getSession().then(({ data: { session } }) => setSession(session));
    const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => setSession(session));
    return () => subscription.unsubscribe();
  }, []);

  if (session === undefined) return (
    <div style={{ minHeight:"100vh", display:"flex", alignItems:"center", justifyContent:"center", background:"#f0fdf4" }}>
      <p style={{ fontSize:16, color:"#6b7280" }}>Loading...</p>
    </div>
  );

  if (!session) return <AuthScreen onAuth={setSession} />;

  return <AppWithData userId={session.user.id} userEmail={session.user.email} onSignOut={async () => { await supabase.auth.signOut(); setSession(null); }} />;
}

function AppWithData({ userId, userEmail, onSignOut }) {
  const db = useData(userId);

  if (db.loading) return (
    <div style={{ minHeight:"100vh", display:"flex", alignItems:"center", justifyContent:"center", background:"#f0fdf4" }}>
      <p style={{ fontSize:16, color:"#6b7280" }}>Loading your data...</p>
    </div>
  );

  // Pass db helpers down via a context-like prop bundle
  return <App data={db.data} update={db.update} dbHelpers={db} userEmail={userEmail} onSignOut={onSignOut} />;
}

const expenseAnnualFactor = (frequency) => ({ weekly: 52, fortnightly: 26, monthly: 12, quarterly: 4, yearly: 1 }[frequency] || 52);
const payPeriodsPerYear = (frequency) => frequency === "fortnightly" ? 26 : 52;
const toPerPayAmount = (amount, expenseFrequency, payFrequency) => {
  const annual = (parseFloat(amount) || 0) * expenseAnnualFactor(expenseFrequency);
  return annual / payPeriodsPerYear(payFrequency);
};
const toWeeklyAmount = (amount, frequency) => ((parseFloat(amount) || 0) * expenseAnnualFactor(frequency)) / 52;

function MiniChart({ data, color, height = 48 }) {
  if (!data || data.length < 2) return null;
  const min = Math.min(...data);
  const max = Math.max(...data);
  const range = max - min || 1;
  const w = 200, h = height;
  const pts = data.map((v, i) => `${(i / (data.length - 1)) * w},${h - ((v - min) / range) * (h - 4) - 2}`).join(" ");
  return (
    <svg viewBox={`0 0 ${w} ${h}`} width="100%" height={h} style={{ overflow: "visible" }}>
      <polyline points={pts} fill="none" stroke={color || "#22c55e"} strokeWidth="2" strokeLinejoin="round" />
    </svg>
  );
}

  const last = homeMonthlyData[homeMonthlyData.length - 1] || MONTHLY_DATA[0];

  const growthFrom = (base) => {
    if (!base || !last || !base.total) return null;
    return { diff: last.total - base.total, pct: ((last.total - base.total) / base.total) * 100 };
  };

  const g1 = growthFrom(itemMonthsBack(1));
  const g6 = growthFrom(itemMonthsBack(6));
  const g12 = growthFrom(itemMonthsBack(12));
  const gStart = growthFrom(startMonth);

  const allocLabels = { expense: "Expense", homeDeposit: "Home deposit", stock: "Stock / investing", nowFun: "Now fun", laterFun: "Later fun", spare: "Spare" };

  const GrowthCard = ({ label, g, locked }) => {
    if (!g || locked) return (
      <div style={{ background: "var(--color-background-primary)", border: "0.5px solid var(--color-border-tertiary)", borderRadius: "var(--border-radius-lg)", padding: "1.25rem 1.5rem", flex: 1, minWidth: 140 }}>
        <p style={{ fontSize: 11, color: "var(--color-text-secondary)", margin: "0 0 10px", textTransform: "uppercase", letterSpacing: "0.06em" }}>{label}</p>
        <p style={{ fontSize: 16, fontWeight: 500, margin: "0 0 4px" }}>Keep tracking...</p>
        <p style={{ fontSize: 12, color: "var(--color-text-secondary)", margin: 0 }}>Available after {locked || "more history"}</p>
      </div>
    );
    const pos = g.diff >= 0;
    const arrow = pos ? "▲" : "▼";
    return (
      <div style={{ background: "var(--color-background-primary)", border: "0.5px solid var(--color-border-tertiary)", borderRadius: "var(--border-radius-lg)", padding: "1.25rem 1.5rem", flex: 1, minWidth: 140 }}>
        <p style={{ fontSize: 11, color: "var(--color-text-secondary)", margin: "0 0 10px", textTransform: "uppercase", letterSpacing: "0.06em" }}>{label}</p>
        <p style={{ fontSize: 22, fontWeight: 500, margin: "0 0 4px", color: pos ? "#22c55e" : "#ef4444" }}>{pos ? "+" : ""}{fmt(g.diff)}</p>
        <p style={{ fontSize: 13, color: pos ? "#22c55e" : "#ef4444", margin: 0 }}>{arrow} {Math.abs(g.pct).toFixed(2)}%</p>
      </div>
    );
  };

  // Tiny sparkline for net worth
  const sparkValsRaw = homeMonthlyData.map(m => m.total || 0);
  const sparkVals = sparkValsRaw.length > 1 ? sparkValsRaw : [0, sparkValsRaw[0] || 0];
  const sparkMin = Math.min(...sparkVals), sparkMax = Math.max(...sparkVals), sparkRange = sparkMax - sparkMin || 1;
  const SW = 600, SH = 80;
  const spX = (i) => (i / Math.max(1, sparkVals.length - 1)) * SW;
  const spY = (v) => SH - 8 - ((v - sparkMin) / sparkRange) * (SH - 16);
  const sparkPts = sparkVals.map((v, i) => `${spX(i).toFixed(1)},${spY(v).toFixed(1)}`).join(" ");
  const sparkArea = `M${spX(0)},${SH} ` + sparkVals.map((v, i) => `L${spX(i).toFixed(1)},${spY(v).toFixed(1)}`).join(" ") + ` L${spX(sparkVals.length-1)},${SH} Z`;

  return (
    <div>
      {/* Hero card */}
      <div style={{ background: "var(--color-background-primary)", border: "0.5px solid var(--color-border-tertiary)", borderRadius: "var(--border-radius-lg)", padding: "1.75rem", marginBottom: "1.25rem" }}>
        <p style={{ fontSize: 12, color: "var(--color-text-secondary)", margin: "0 0 6px", textTransform: "uppercase", letterSpacing: "0.08em" }}>Total net worth — {last.label}</p>
        <p style={{ fontSize: 48, fontWeight: 500, margin: "0 0 20px", letterSpacing: "-1.5px", lineHeight: 1, color: "var(--color-text-primary)" }}>{fmt(last.total)}</p>
        {/* sparkline */}
        <svg viewBox={`0 0 ${SW} ${SH}`} width="100%" height={SH} style={{ display: "block" }}>
          <defs>
            <linearGradient id="sparkGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stopColor="#22c55e" stopOpacity="0.18" />
              <stop offset="100%" stopColor="#22c55e" stopOpacity="0" />
            </linearGradient>
          </defs>
          <path d={sparkArea} fill="url(#sparkGrad)" />
          <polyline points={sparkPts} fill="none" stroke="#22c55e" strokeWidth="2" strokeLinejoin="round" />
          <circle cx={spX(sparkVals.length-1)} cy={spY(sparkVals[sparkVals.length-1])} r="4" fill="#22c55e" />
        </svg>
        <div style={{ display: "flex", justifyContent: "space-between", marginTop: 6 }}>
          <span style={{ fontSize: 10, color: "var(--color-text-secondary)" }}>{homeMonthlyData[0]?.label || "Start"}</span>
          <span style={{ fontSize: 10, color: "var(--color-text-secondary)" }}>{last.label}</span>
        </div>
      </div>

      {/* Growth cards */}
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(140px, 1fr))", gap: 10, marginBottom: "1.25rem" }}>
        <GrowthCard label="1 month" g={g1} locked={homeMonthlyData.length < 2 ? "1 month of history" : null} />
        <GrowthCard label="6 months" g={g6} locked={homeMonthlyData.length < 7 ? "6 months of history" : null} />
        <GrowthCard label="1 year" g={g12} locked={homeMonthlyData.length < 13 ? "12 months of history" : null} />
        <GrowthCard label="Since start" g={gStart} locked={homeMonthlyData.length < 2 ? "more than one month" : null} />
      </div>

      {/* Key stats row */}
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(130px, 1fr))", gap: 10, marginBottom: "1.25rem" }}>
        {[
          { label: "Stocks", value: fmt(last.stock), color: "#3b82f6" },
          { label: "Gold", value: fmt(last.gold), color: "#eab308" },
          { label: "Crypto", value: fmt(last.crypto, 2), color: "#f59e0b" },
          { label: "Avg weekly income", value: fmt(avgWeeklyIncome), color: "#22c55e" },
        ].map(c => (
          <div key={c.label} style={{ background: "var(--color-background-secondary)", borderRadius: "var(--border-radius-md)", padding: "12px 14px" }}>
            <p style={{ fontSize: 11, color: "var(--color-text-secondary)", margin: "0 0 4px", textTransform: "uppercase", letterSpacing: "0.04em" }}>{c.label}</p>
            <p style={{ fontSize: 18, fontWeight: 500, margin: 0, color: c.color }}>{c.value}</p>
          </div>
        ))}
      </div>


      {data.pay?.onboardingComplete && (
        <div style={{ background: "var(--color-background-primary)", border: "0.5px solid var(--color-border-tertiary)", borderRadius: "var(--border-radius-lg)", padding: "1.25rem", marginBottom: "1.25rem" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
            <h3 style={{ fontSize: 14, fontWeight: 500, margin: 0 }}>Your pay cycle setup</h3>
            <span style={{ fontSize: 12, color: "var(--color-text-secondary)", textTransform: "capitalize" }}>{data.pay.payFrequency || "weekly"}</span>
          </div>
          {(() => {
            const payFreq = data.pay.payFrequency || "weekly";
            const payAmount = parseFloat(data.pay.regularPayAmount || 0);
            const billsPerPay = (data.pay.recurringExpenses || []).reduce((s, e) => s + toPerPayAmount(e.amount, e.frequency, payFreq), 0);
            const savingInvestingPct = (allocs.homeDeposit || 0) + (allocs.stock || 0) + (allocs.icoe || 0) + (allocs.laterFun || 0);
            const plannedSaving = payAmount * savingInvestingPct / 100;
            const flexibleAfterBillsAndGoals = Math.max(0, payAmount - billsPerPay - plannedSaving);
            return (
              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(130px, 1fr))", gap: 10 }}>
                <StatCard label="Pay per cycle" value={fmt(payAmount)} sub={data.pay.nextPayDate ? "Next pay " + fmtDate(data.pay.nextPayDate) : "Regular pay"} color="#22c55e" />
                <StatCard label="Bills per cycle" value={fmt(billsPerPay)} sub={`${(data.pay.recurringExpenses || []).length} recurring expenses`} color="#ef4444" />
                <StatCard label="Goals/investing" value={fmt(plannedSaving)} sub={`${savingInvestingPct.toFixed(1)}% of pay`} color="#3b82f6" />
                <StatCard label="Flexible spend" value={fmt(flexibleAfterBillsAndGoals)} sub="After bills + goals" color="#f59e0b" />
              </div>
            );
          })()}
        </div>
      )}

      {/* Weekly allocation */}
      <div style={{ background: "var(--color-background-primary)", border: "0.5px solid var(--color-border-tertiary)", borderRadius: "var(--border-radius-lg)", padding: "1.25rem" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
          <h3 style={{ fontSize: 14, fontWeight: 500, margin: 0 }}>Weekly allocation</h3>
          <span style={{ fontSize: 12, color: "var(--color-text-secondary)" }}>Avg {fmt(avgWeeklyIncome)}/wk</span>
        </div>
        <div style={{ display: "flex", height: 8, borderRadius: 99, overflow: "hidden", marginBottom: 14 }}>
          {Object.entries(allocs).map(([k, v]) => (
            <div key={k} style={{ flex: v, background: allocColors[k] || "#888", minWidth: 2 }} title={`${allocLabels[k]}: ${v}%`} />
          ))}
        </div>
        {Object.entries(allocs).map(([k, v]) => {
          const weekly = (avgWeeklyIncome * v) / 100;
          const monthly = weekly * 4.33;
          return (
            <div key={k} style={{ display: "flex", alignItems: "center", gap: 10, padding: "7px 0", borderBottom: "0.5px solid var(--color-border-tertiary)" }}>
              <span style={{ width: 10, height: 10, borderRadius: 2, background: allocColors[k] || "#888", flexShrink: 0 }} />
              <span style={{ fontSize: 13, flex: 1, color: "var(--color-text-secondary)" }}>{allocLabels[k] || k}</span>
              <span style={{ fontSize: 12, color: "var(--color-text-secondary)", minWidth: 32, textAlign: "right" }}>{v}%</span>
              <span style={{ fontSize: 13, fontWeight: 500, minWidth: 68, textAlign: "right" }}>{fmt(weekly, 0)}<span style={{ fontSize: 11, fontWeight: 400, color: "var(--color-text-secondary)" }}>/wk</span></span>
              <span style={{ fontSize: 12, color: "var(--color-text-secondary)", minWidth: 70, textAlign: "right" }}>{fmt(monthly, 0)}/mo</span>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ========= DASHBOARD =========
function Dashboard({ data }) {
  const W = 600;

  const LineChart = ({ points, H, color, area, yGrids = 4, labels }) => {
    if (!points || points.length < 2) return null;
    const minV = Math.min(...points), maxV = Math.max(...points), rangeV = maxV - minV || 1;
    const PAD_T = 18, PAD_B = labels ? 26 : 8, PAD_L = 62;
    const CW = W - PAD_L;
    const toX = (i) => PAD_L + (i / (points.length - 1)) * CW;
    const toY = (v) => PAD_T + (1 - (v - minV) / rangeV) * (H - PAD_T - PAD_B);
    const ptStr = points.map((v, i) => `${toX(i).toFixed(1)},${toY(v).toFixed(1)}`).join(" ");
    const areaPath = `M${toX(0).toFixed(1)},${H - PAD_B} ` + points.map((v, i) => `L${toX(i).toFixed(1)},${toY(v).toFixed(1)}`).join(" ") + ` L${toX(points.length - 1).toFixed(1)},${H - PAD_B} Z`;
    const grids = Array.from({ length: yGrids }, (_, i) => i / (yGrids - 1));
    return (
      <>
        {grids.map(r => {
          const yVal = minV + rangeV * r;
          const yPx = toY(yVal);
          return (
            <g key={r}>
              <line x1={PAD_L} y1={yPx} x2={W} y2={yPx} stroke="var(--color-border-tertiary)" strokeWidth="0.5" />
              <text x={PAD_L - 6} y={yPx + 3} fontSize={9} fill="var(--color-text-secondary)" textAnchor="end">{fmt(yVal)}</text>
            </g>
          );
        })}
        {area && <path d={areaPath} fill={color} fillOpacity="0.08" />}
        <polyline points={ptStr} fill="none" stroke={color} strokeWidth="2" strokeLinejoin="round" />
        <circle cx={toX(points.length - 1)} cy={toY(points[points.length - 1])} r="3.5" fill={color} />
        {labels && labels.map((lb, i) => {
          if (i % Math.max(1, Math.floor(labels.length / 8)) !== 0 && i !== labels.length - 1) return null;
          return <text key={i} x={toX(i)} y={H - 6} fontSize={9} fill="var(--color-text-secondary)" textAnchor="middle">{lb}</text>;
        })}
      </>
    );
  };

  const BarChart = ({ bars, H }) => {
    if (!bars || bars.length === 0) return null;
    const PAD_B = 24, PAD_T = 8, PAD_L = 62;
    const CW = W - PAD_L;
    const maxAbs = Math.max(...bars.map(b => Math.abs(b.value)), 1);
    const zeroY = PAD_T + (H - PAD_T - PAD_B) / 2;
    const barW = Math.floor((CW / bars.length) * 0.55);
    const gap = CW / bars.length;
    return (
      <>
        <line x1={PAD_L} y1={zeroY} x2={W} y2={zeroY} stroke="var(--color-border-secondary)" strokeWidth="0.5" />
        <text x={PAD_L - 6} y={zeroY + 3} fontSize={9} fill="var(--color-text-secondary)" textAnchor="end">$0</text>
        {[maxAbs, -maxAbs].map((v, i) => {
          const yPx = i === 0 ? PAD_T + 9 : H - PAD_T - 6;
          return <text key={i} x={PAD_L - 6} y={yPx} fontSize={9} fill="var(--color-text-secondary)" textAnchor="end">{fmt(v)}</text>;
        })}
        {/* left axis line */}
        <line x1={PAD_L} y1={PAD_T} x2={PAD_L} y2={H - PAD_B} stroke="var(--color-border-tertiary)" strokeWidth="0.5" />
        {bars.map((b, i) => {
          const cx = PAD_L + gap * i + gap / 2;
          const barH = (Math.abs(b.value) / (maxAbs * 2)) * (H - PAD_T - PAD_B);
          const positive = b.value >= 0;
          const barY = positive ? zeroY - barH : zeroY;
          return (
            <g key={i}>
              <rect x={cx - barW / 2} y={barY} width={barW} height={Math.max(barH, 1)} fill={positive ? "#22c55e" : "#ef4444"} rx="2" fillOpacity="0.85" />
              <text x={cx} y={H - 6} fontSize={9} fill="var(--color-text-secondary)" textAnchor="middle">{b.label}</text>
            </g>
          );
        })}
      </>
    );
  };

  // ── Build live monthly data — prefer monthlyReports when available ──────
  const SNAPSHOT = "2026-05-14";
  const portfolioValue = data.portfolio.reduce((s, h) => s + h.units * h.price, 0);

  // Months that have a locked monthly report take priority
  const reportedMonths = new Set((data.monthlyReports || []).map(r => r.month));

  // Get all months from live income entries after snapshot (excluding reported ones)
  const liveMonths = [...new Set(
    data.incomeEntries
      .filter(e => e.date > SNAPSHOT && !reportedMonths.has(e.date.slice(0, 7)))
      .map(e => e.date.slice(0, 7))
  )].sort();

  // For each live month, compute net worth = last known total + cumulative income - cumulative expenses
  const liveMonthData = (() => {
    const baseTotal = MONTHLY_DATA[MONTHLY_DATA.length - 1].total;
    const baseStock = portfolioValue; // use live portfolio value
    let runningTotal = baseTotal;
    let prevTotal = baseTotal;

    return liveMonths.map(m => {
      const monthIncome = data.incomeEntries
        .filter(e => e.date > SNAPSHOT && e.date.slice(0, 7) === m)
        .reduce((s, e) => s + e.net, 0);
      const monthExpenses = data.expenses
        .filter(e => e.date > SNAPSHOT && e.date.slice(0, 7) === m)
        .reduce((s, e) => s + e.amount, 0);
      runningTotal = runningTotal + monthIncome - monthExpenses;
      const balanceGrowth = runningTotal - prevTotal;
      const growthPct = prevTotal > 0 ? (balanceGrowth / prevTotal) * 100 : 0;
      prevTotal = runningTotal;

      const [yr, mo] = m.split("-");
      const label = new Date(+yr, +mo - 1, 1).toLocaleDateString("en-AU", { month: "short", year: "2-digit" }).replace(" ", "-");

      return {
        month: m,
        label,
        total: Math.round(runningTotal),
        stock: baseStock,
        gold: MONTHLY_DATA[MONTHLY_DATA.length - 1].gold,
        crypto: MONTHLY_DATA[MONTHLY_DATA.length - 1].crypto,
        investGrowth: null,
        balanceGrowth: Math.round(balanceGrowth),
        growthPct: parseFloat(growthPct.toFixed(2)),
        isLive: true,
      };
    });
  })();

  // Monthly reports (locked months) become chart data points
  const reportedMonthData = (data.monthlyReports || []).map(r => ({
    month: r.month,
    label: r.label,
    total: r.netTotal,
    stock: r.stockTotal,
    gold: r.goldTotal,
    crypto: r.cryptoTotal,
    investGrowth: r.investGrowth,
    balanceGrowth: r.balanceGrowth,
    growthPct: r.growthPct,
  }));

  // Combined: hardcoded history + locked reports + live unreported months
  const allMonthlyData = [...MONTHLY_DATA, ...reportedMonthData, ...liveMonthData];

  const shortLabel = (m) => m.label.replace(/-\d{4}$/, "").replace(/^(\w+)-(\d{2})$/, (_, mon, yr) => mon + "-" + yr).replace("-25","").replace("-26","").replace("-27","");
  const shortLabels = allMonthlyData.map(shortLabel);
  const investBars  = allMonthlyData.slice(1).map(m => ({ label: shortLabel(m), value: m.investGrowth || 0 }));
  const balanceBars = allMonthlyData.slice(1).map(m => ({ label: shortLabel(m), value: m.balanceGrowth || 0 }));
  const tableRows   = allMonthlyData;

  return (
    <div>
      <div style={{ marginBottom: "1.5rem" }}>
        <h1 style={{ fontSize: 22, fontWeight: 500, margin: "0 0 4px" }}>Charts & analytics</h1>
        <p style={{ color: "var(--color-text-secondary)", margin: 0, fontSize: 14 }}>All your financial trends in one place</p>
      </div>

      {/* Net worth over time */}
      <div style={{ background: "var(--color-background-primary)", border: "0.5px solid var(--color-border-tertiary)", borderRadius: "var(--border-radius-lg)", padding: "1.25rem", marginBottom: "1.25rem" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
          <h3 style={{ fontSize: 14, fontWeight: 500, margin: 0 }}>Total net worth</h3>
          <span style={{ fontSize: 12, color: "var(--color-text-secondary)" }}>{allMonthlyData.length} months{liveMonthData.length > 0 && <span style={{color:"#22c55e",marginLeft:6}}>+{liveMonthData.length} live</span>}</span>
        </div>
        <svg viewBox={`0 0 ${W} 190`} width="100%" height={190} style={{ overflow: "visible" }}>
          <LineChart points={allMonthlyData.map(m => m.total)} H={190} color="#22c55e" area yGrids={4} labels={shortLabels} />
        </svg>
      </div>

      {/* Investment breakdown — stocks, gold, crypto */}
      <div style={{ background: "var(--color-background-primary)", border: "0.5px solid var(--color-border-tertiary)", borderRadius: "var(--border-radius-lg)", padding: "1.25rem", marginBottom: "1.25rem" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
          <h3 style={{ fontSize: 14, fontWeight: 500, margin: 0 }}>Investment breakdown</h3>
          <div style={{ display: "flex", gap: 14, fontSize: 11, color: "var(--color-text-secondary)" }}>
            {[["Stocks","#3b82f6"],["Gold","#eab308"],["Crypto","#f59e0b"]].map(([l,c]) => (
              <span key={l} style={{ display: "flex", alignItems: "center", gap: 5 }}>
                <span style={{ width: 12, height: 2, background: c, display: "inline-block", borderRadius: 1 }} />{l}
              </span>
            ))}
          </div>
        </div>
        <svg viewBox={`0 0 ${W} 170`} width="100%" height={170} style={{ overflow: "visible" }}>
          {(() => {
            const allVals = [...allMonthlyData.map(m => m.stock), ...allMonthlyData.map(m => m.gold)];
            const minV = Math.min(...allVals), maxV = Math.max(...allVals), rangeV = maxV - minV || 1;
            const PAD_T = 14, PAD_B = 22, PAD_L = 62, H = 170;
            const CW = W - PAD_L;
            const toX = (i) => PAD_L + (i / (allMonthlyData.length - 1)) * CW;
            const toY = (v) => PAD_T + (1 - (v - minV) / rangeV) * (H - PAD_T - PAD_B);
            const line = (key, color, dash) => {
              const pts = allMonthlyData.map((m, i) => `${toX(i).toFixed(1)},${toY(m[key]).toFixed(1)}`).join(" ");
              return <polyline key={key} points={pts} fill="none" stroke={color} strokeWidth="2" strokeLinejoin="round" strokeDasharray={dash} />;
            };
            const dots = (key, color) => allMonthlyData.map((m, i) => (
              i === allMonthlyData.length - 1 ? <circle key={i} cx={toX(i)} cy={toY(m[key])} r="3.5" fill={color} /> : null
            ));
            return <>
              {[0, 0.33, 0.66, 1].map(r => {
                const yVal = minV + rangeV * r;
                const yPx = toY(yVal);
                return <g key={r}>
                  <line x1={PAD_L} y1={yPx} x2={W} y2={yPx} stroke="var(--color-border-tertiary)" strokeWidth="0.5" />
                  <text x={PAD_L - 6} y={yPx + 3} fontSize={9} fill="var(--color-text-secondary)" textAnchor="end">{fmt(yVal)}</text>
                </g>;
              })}
              {line("stock","#3b82f6")}
              {line("gold","#eab308","5 3")}
              {dots("stock","#3b82f6")}
              {dots("gold","#eab308")}
              {/* Crypto scaled for visibility */}
              {(() => {
                const cryptoMax = Math.max(...allMonthlyData.map(m => m.crypto));
                const cPts = allMonthlyData.map((m, i) => {
                  const scaled = minV + (m.crypto / cryptoMax) * rangeV * 0.25;
                  return `${toX(i).toFixed(1)},${toY(scaled).toFixed(1)}`;
                }).join(" ");
                return <><polyline points={cPts} fill="none" stroke="#f59e0b" strokeWidth="1.5" strokeDasharray="3 3" />
                  <circle cx={toX(allMonthlyData.length-1)} cy={toY(minV + (allMonthlyData[allMonthlyData.length-1].crypto / cryptoMax) * rangeV * 0.25)} r="3" fill="#f59e0b" /></>;
              })()}
              {shortLabels.map((lb, i) => {
                if (i % 2 !== 0 && i !== shortLabels.length - 1) return null;
                return <text key={i} x={toX(i)} y={H - 5} fontSize={9} fill="var(--color-text-secondary)" textAnchor="middle">{lb}</text>;
              })}
            </>;
          })()}
        </svg>
      </div>

      {/* Monthly investment growth bar chart */}
      <div style={{ background: "var(--color-background-primary)", border: "0.5px solid var(--color-border-tertiary)", borderRadius: "var(--border-radius-lg)", padding: "1.25rem", marginBottom: "1.25rem" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
          <h3 style={{ fontSize: 14, fontWeight: 500, margin: 0 }}>Monthly investment growth</h3>
          <span style={{ fontSize: 12, color: "var(--color-text-secondary)" }}>Market gains / losses on portfolio</span>
        </div>
        <svg viewBox={`0 0 ${W} 160`} width="100%" height={160} style={{ overflow: "visible" }}>
          <BarChart bars={investBars} H={160} />
        </svg>
      </div>

      {/* Monthly balance growth bar chart */}
      <div style={{ background: "var(--color-background-primary)", border: "0.5px solid var(--color-border-tertiary)", borderRadius: "var(--border-radius-lg)", padding: "1.25rem", marginBottom: "1.25rem" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
          <h3 style={{ fontSize: 14, fontWeight: 500, margin: 0 }}>Monthly balance growth</h3>
          <span style={{ fontSize: 12, color: "var(--color-text-secondary)" }}>Total net worth change per month</span>
        </div>
        <svg viewBox={`0 0 ${W} 140`} width="100%" height={140} style={{ overflow: "visible" }}>
          <BarChart bars={balanceBars} H={140} />
        </svg>
        <div style={{ display: "flex", marginTop: 10, gap: 2 }}>
          {allMonthlyData.slice(1).map((m, i) => {
            const pos = (m.growthPct || 0) >= 0;
            return (
              <div key={i} style={{ flex: 1, textAlign: "center" }}>
                <span style={{ fontSize: 10, fontWeight: 500, color: pos ? "#22c55e" : "#ef4444" }}>
                  {pos ? "+" : ""}{(m.growthPct || 0).toFixed(1)}%
                </span>
              </div>
            );
          })}
        </div>
      </div>

      {/* All months table */}
      <div style={{ background: "var(--color-background-primary)", border: "0.5px solid var(--color-border-tertiary)", borderRadius: "var(--border-radius-lg)", padding: "1.25rem" }}>
        <h3 style={{ fontSize: 14, fontWeight: 500, margin: "0 0 14px" }}>All months</h3>
        <div style={{ overflowX: "auto" }}>
          <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12 }}>
            <thead>
              <tr style={{ borderBottom: "0.5px solid var(--color-border-tertiary)" }}>
                {["Month","Total","Stocks","Gold","Crypto","Inv. growth","Balance change","Growth %"].map((h, i) => (
                  <th key={h} style={{ padding: "5px 8px", fontWeight: 500, color: "var(--color-text-secondary)", textAlign: i === 0 ? "left" : "right", whiteSpace: "nowrap" }}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {tableRows.map((m, i) => {
                const pos = (m.growthPct || 0) >= 0;
                const iPos = (m.investGrowth || 0) >= 0;
                const bPos = (m.balanceGrowth || 0) >= 0;
                const isLast = i === tableRows.length - 1;
                return (
                  <tr key={m.month} style={{ borderBottom: "0.5px solid var(--color-border-tertiary)", background: isLast ? "var(--color-background-secondary)" : "transparent" }}>
                    <td style={{ padding: "7px 8px", fontWeight: isLast ? 500 : 400 }}>{m.label}</td>
                    <td style={{ padding: "7px 8px", textAlign: "right", fontWeight: 500 }}>{fmt(m.total)}</td>
                    <td style={{ padding: "7px 8px", textAlign: "right" }}>{fmt(m.stock)}</td>
                    <td style={{ padding: "7px 8px", textAlign: "right" }}>{fmt(m.gold)}</td>
                    <td style={{ padding: "7px 8px", textAlign: "right" }}>{fmt(m.crypto, 2)}</td>
                    <td style={{ padding: "7px 8px", textAlign: "right", color: m.investGrowth === null ? "var(--color-text-secondary)" : iPos ? "#22c55e" : "#ef4444" }}>
                      {m.investGrowth === null ? "—" : (iPos ? "+" : "") + fmt(m.investGrowth, 2)}
                    </td>
                    <td style={{ padding: "7px 8px", textAlign: "right", color: m.balanceGrowth === null ? "var(--color-text-secondary)" : bPos ? "#22c55e" : "#ef4444" }}>
                      {m.balanceGrowth === null ? "—" : (bPos ? "+" : "") + fmt(m.balanceGrowth, 2)}
                    </td>
                    <td style={{ padding: "7px 8px", textAlign: "right", fontWeight: 500, color: m.growthPct === null ? "var(--color-text-secondary)" : pos ? "#22c55e" : "#ef4444" }}>
                      {m.growthPct === null ? "—" : (pos ? "+" : "") + (m.growthPct || 0).toFixed(2) + "%"}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

// ========= WEEKLY UPDATE =========
function WeeklyUpdate({ data, update, dbHelpers }) {
  const [pay, setPay] = useState("");
  const [date, setDate] = useState(new Date().toISOString().slice(0, 10));
  const [source, setSource] = useState("Salary");
  const [saved, setSaved] = useState(false);
  const [totalCash, setTotalCash] = useState("");
  const [cashSaved, setCashSaved] = useState(false);

  const allocs = data.settings.allocations;
  const net = parseFloat(pay) || 0;

  const BUCKET_LABELS = { expense: "Expense", homeDeposit: "Home deposit", stock: "Stock & Crypto", nowFun: "Now fun", laterFun: "Later fun", spare: "Spare" };
  const BUCKET_COLORS = { expense: "#ef4444", homeDeposit: "#8b5cf6", stock: "#3b82f6", nowFun: "#ec4899", laterFun: "#a855f7", spare: "#14b8a6" };

  const breakdown = {
    expense:     (net * allocs.expense) / 100,
    homeDeposit: (net * allocs.homeDeposit) / 100,
    stock:       (net * allocs.stock) / 100,
    nowFun:      (net * allocs.nowFun) / 100,
    laterFun:    (net * allocs.laterFun) / 100,
    spare:       (net * (allocs.spare || 0)) / 100,
  };

  // Running bucket balances (same calc as Buckets page)
  const totalIncome = data.incomeEntries.reduce((s, e) => s + e.net, 0);
  const SNAPSHOT = "2026-05-14";
  const bucketBalance = (key) => {
    const start = data.startingBalances[key] || 0;
    const newIncome = data.incomeEntries.filter(e => e.date > SNAPSHOT).reduce((s, e) => s + e.net, 0);
    const allocated = (newIncome * (allocs[key] || 0)) / 100;
    const spent = data.expenses.filter(e => e.bucket === key && e.date > SNAPSHOT).reduce((s, e) => s + e.amount, 0);
    return start + allocated - spent;
  };

  // Cash check: total cash minus all locked buckets = Now Fun (what you can actually spend)
  const cashEntered = parseFloat(totalCash) || 0;
  const committedBuckets = ["icoe", "expense", "homeDeposit", "stock", "laterFun", "spare"];
  const committedTotal = committedBuckets.reduce((s, key) => s + bucketBalance(key), 0);
  const nowFunAvailable = cashEntered > 0 ? cashEntered - committedTotal : null;

  const handleSave = () => {
    if (!net) return;
    const newEntry = { id: Date.now(), date, gross: net, net, source };
    update(d => ({ ...d, incomeEntries: [...d.incomeEntries, newEntry] }));
    if (dbHelpers?.saveIncome) dbHelpers.saveIncome(newEntry);
    setSaved(true);
    setTimeout(() => setSaved(false), 2500);
    setPay("");
  };

  const handleCashSave = () => {
    update(d => ({ ...d, lastCashCheck: { date, totalCash: cashEntered, nowFunAvailable } }));
    setCashSaved(true);
    setTimeout(() => setCashSaved(false), 2500);
  };

  return (
    <div>
      <div style={{ marginBottom: "1.5rem" }}>
        <h1 style={{ fontSize: 22, fontWeight: 500, margin: "0 0 4px" }}>Weekly update</h1>
        <p style={{ color: "var(--color-text-secondary)", margin: 0, fontSize: 14 }}>Enter your pay, check your cash, and see how it splits</p>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "1rem", marginBottom: "1.25rem" }}>
        {/* Pay entry */}
        <div style={{ background: "var(--color-background-primary)", border: "0.5px solid var(--color-border-tertiary)", borderRadius: "var(--border-radius-lg)", padding: "1.25rem" }}>
          <h3 style={{ fontSize: 14, fontWeight: 500, margin: "0 0 16px" }}>Step 1 — Enter this week's pay</h3>
          <Input label="Date" type="date" value={date} onChange={setDate} />
          <Input label="Take-home pay (AUD)" type="number" value={pay} onChange={setPay} placeholder="e.g. 1050" step="0.01" />
          <Select label="Income source" value={source} onChange={setSource} options={[
            { value: "Salary", label: "Salary" },
            { value: "Freelance", label: "Freelance" },
            { value: "Dividends", label: "Dividends" },
            { value: "Other", label: "Other" },
          ]} />
          <button onClick={handleSave} style={{ width: "100%", padding: "10px", borderRadius: "var(--border-radius-md)", background: "#22c55e", color: "#fff", border: "none", cursor: "pointer", fontSize: 14, fontWeight: 500 }}>
            {saved ? "Saved!" : "Save pay entry"}
          </button>
        </div>

        {/* Allocation preview */}
        <div style={{ background: "var(--color-background-primary)", border: "0.5px solid var(--color-border-tertiary)", borderRadius: "var(--border-radius-lg)", padding: "1.25rem" }}>
          <h3 style={{ fontSize: 14, fontWeight: 500, margin: "0 0 16px" }}>Auto-allocation</h3>
          {net === 0 ? (
            <p style={{ color: "var(--color-text-secondary)", fontSize: 13 }}>Enter your pay to see how it splits across your buckets.</p>
          ) : (
            Object.entries(breakdown).map(([k, v]) => (
              <div key={k} style={{ display: "flex", alignItems: "center", gap: 8, padding: "7px 0", borderBottom: "0.5px solid var(--color-border-tertiary)" }}>
                <span style={{ width: 8, height: 8, borderRadius: 2, background: BUCKET_COLORS[k] || "#888", flexShrink: 0 }} />
                <span style={{ fontSize: 13, flex: 1, color: "var(--color-text-secondary)" }}>{BUCKET_LABELS[k] || k}</span>
                <span style={{ fontSize: 14, fontWeight: 500 }}>{fmt(v, 2)}</span>
              </div>
            ))
          )}
          {net > 0 && (
            <div style={{ display: "flex", justifyContent: "space-between", paddingTop: 8 }}>
              <span style={{ fontSize: 12, color: "var(--color-text-secondary)" }}>Total allocated</span>
              <span style={{ fontSize: 13, fontWeight: 500 }}>{fmt(net, 2)}</span>
            </div>
          )}
        </div>
      </div>

      {/* Cash check */}
      <div style={{ background: "var(--color-background-primary)", border: "0.5px solid var(--color-border-tertiary)", borderRadius: "var(--border-radius-lg)", padding: "1.25rem", marginBottom: "1.25rem" }}>
        <h3 style={{ fontSize: 14, fontWeight: 500, margin: "0 0 4px" }}>Step 2 — Cash check</h3>
        <p style={{ fontSize: 13, color: "var(--color-text-secondary)", margin: "0 0 16px" }}>Enter how much total cash you have right now (not including shares or assets). We'll subtract your allocated buckets and show what's free to spend this week.</p>
        <div style={{ display: "grid", gridTemplateColumns: "1fr auto", gap: 10, alignItems: "flex-end", marginBottom: 16 }}>
          <Input label="Total cash on hand (AUD)" type="number" value={totalCash} onChange={setTotalCash} placeholder="e.g. 21500" step="0.01" />
          <button onClick={handleCashSave} style={{ padding: "9px 16px", borderRadius: "var(--border-radius-md)", background: cashSaved ? "#22c55e" : "var(--color-background-secondary)", border: "0.5px solid var(--color-border-secondary)", cursor: "pointer", fontSize: 13, fontWeight: 500, color: cashSaved ? "#fff" : "var(--color-text-primary)", whiteSpace: "nowrap", marginBottom: "1rem" }}>
            {cashSaved ? "Saved!" : "Save"}
          </button>
        </div>
        {cashEntered > 0 && (
          <div>
            <div style={{ display: "flex", flexDirection: "column", gap: 7, marginBottom: 14 }}>
              <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13 }}>
                <span style={{ fontWeight: 500 }}>Total cash on hand</span>
                <span style={{ fontWeight: 500 }}>{fmt(cashEntered, 2)}</span>
              </div>
              {committedBuckets.map(key => {
                const bal = bucketBalance(key);
                const labels = { icoe: "ICOE", expense: "Expense", homeDeposit: "Home deposit", stock: "Stock & Crypto", laterFun: "Later fun", spare: "Spare" };
                return (
                  <div key={key} style={{ display: "flex", justifyContent: "space-between", fontSize: 13 }}>
                    <span style={{ color: "var(--color-text-secondary)" }}>− {labels[key]}</span>
                    <span style={{ color: "#ef4444" }}>{fmt(bal, 2)}</span>
                  </div>
                );
              })}
              <div style={{ height: "0.5px", background: "var(--color-border-secondary)", margin: "4px 0" }} />
              <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13 }}>
                <span style={{ color: "var(--color-text-secondary)" }}>Total committed</span>
                <span style={{ fontWeight: 500 }}>{fmt(committedTotal, 2)}</span>
              </div>
            </div>
            <div style={{ background: nowFunAvailable >= 0 ? "#f0fdf4" : "#fef2f2", border: `0.5px solid ${nowFunAvailable >= 0 ? "#bbf7d0" : "#fecaca"}`, borderRadius: "var(--border-radius-lg)", padding: "14px 16px" }}>
              <p style={{ fontSize: 11, color: nowFunAvailable >= 0 ? "#166534" : "#991b1b", margin: "0 0 4px", textTransform: "uppercase", letterSpacing: "0.06em" }}>Now fun — available to spend</p>
              <p style={{ fontSize: 34, fontWeight: 500, margin: "0 0 4px", color: nowFunAvailable >= 0 ? "#22c55e" : "#ef4444", letterSpacing: "-0.5px" }}>{fmt(nowFunAvailable, 2)}</p>
              <p style={{ fontSize: 12, color: nowFunAvailable >= 0 ? "#166534" : "#991b1b", margin: 0 }}>
                {nowFunAvailable >= 0 ? "This is your free spending money. Enjoy it." : "You are over your committed buckets. Check your Buckets page."}
              </p>
            </div>
          </div>
        )}
      </div>

      {/* Income history */}
      <div style={{ background: "var(--color-background-primary)", border: "0.5px solid var(--color-border-tertiary)", borderRadius: "var(--border-radius-lg)", padding: "1.25rem" }}>
        <h3 style={{ fontSize: 14, fontWeight: 500, margin: "0 0 16px" }}>Income history ({data.incomeEntries.length} entries)</h3>
        <div style={{ overflowX: "auto" }}>
          <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
            <thead>
              <tr style={{ borderBottom: "0.5px solid var(--color-border-tertiary)" }}>
                {["Date", "Source", "Net income"].map(h => (
                  <th key={h} style={{ textAlign: "left", padding: "6px 8px", fontWeight: 500, color: "var(--color-text-secondary)" }}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {[...data.incomeEntries].sort((a, b) => b.date.localeCompare(a.date)).slice(0, 5).map(e => (
                <tr key={e.id} style={{ borderBottom: "0.5px solid var(--color-border-tertiary)" }}>
                  <td style={{ padding: "7px 8px" }}>{fmtDate(e.date)}</td>
                  <td style={{ padding: "7px 8px", color: "var(--color-text-secondary)" }}>{e.source}</td>
                  <td style={{ padding: "7px 8px", fontWeight: 500, color: "#22c55e" }}>{fmt(e.net, 2)}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

// ========= EXPENSES =========
function Expenses({ data, update, dbHelpers }) {
  const [showForm, setShowForm] = useState(false);
  const [form, setForm] = useState({ date: new Date().toISOString().slice(0, 10), bucket: "", amount: "", notes: "" });
  const [saved, setSaved] = useState(false);

  const BUCKETS = [
    { key: "icoe",       label: "ICOE",         color: "#22c55e" },
    { key: "expense",    label: "Expense",       color: "#ef4444" },
    { key: "homeDeposit",label: "Home deposit",  color: "#8b5cf6" },
    { key: "stock",      label: "Stock & Crypto",color: "#3b82f6" },
    { key: "nowFun",     label: "Now fun",       color: "#ec4899" },
    { key: "laterFun",   label: "Later fun",     color: "#a855f7" },
    { key: "spare",      label: "Spare",         color: "#14b8a6" },
  ];

  const allocs = data.settings.allocations;
  const totalIncome = data.incomeEntries.reduce((s, e) => s + e.net, 0);
  const SNAPSHOT = "2026-05-14";
  const bucketBalance = (key) => {
    const start = data.startingBalances[key] || 0;
    const newIncome = data.incomeEntries.filter(e => e.date > SNAPSHOT).reduce((s, e) => s + e.net, 0);
    const allocated = (newIncome * (allocs[key] || 0)) / 100;
    const spent = data.expenses.filter(e => e.bucket === key && e.date > SNAPSHOT).reduce((s, e) => s + e.amount, 0);
    return start + allocated - spent;
  };

  const handleSave = () => {
    if (!form.bucket || !form.amount) return;
    const newExp = { ...form, id: Date.now(), amount: parseFloat(form.amount), category: form.bucket, description: "" };
    update(d => ({ ...d, expenses: [...d.expenses, newExp] }));
    if (dbHelpers?.saveExpense) dbHelpers.saveExpense(newExp);
    setSaved(true);
    setShowForm(false);
    setForm({ date: new Date().toISOString().slice(0, 10), bucket: "", amount: "", notes: "" });
    setTimeout(() => setSaved(false), 2500);
  };

  const handleDelete = (id) => update(d => ({ ...d, expenses: d.expenses.filter(e => e.id !== id) }));

  // Monthly tracker — group expenses by month and bucket
  const months = [...new Set(data.expenses.map(e => e.date.slice(0,7)))].sort().reverse();
  const monthLabel = (m) => { const [y, mo] = m.split("-"); return new Date(+y, +mo-1, 1).toLocaleDateString("en-AU", { month: "short", year: "2-digit" }); };

  const bucketKey = (key) => BUCKETS.find(b => b.key === key);

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: "1.5rem" }}>
        <div>
          <h1 style={{ fontSize: 22, fontWeight: 500, margin: "0 0 4px" }}>Expenses</h1>
          <p style={{ color: "var(--color-text-secondary)", margin: 0, fontSize: 14 }}>Log spending against your buckets</p>
        </div>
      </div>

      {/* Add expense prompt / form */}
      {!showForm ? (
        <button onClick={() => setShowForm(true)} style={{ width: "100%", padding: "1.25rem", borderRadius: "var(--border-radius-lg)", border: "1.5px dashed var(--color-border-secondary)", background: "transparent", cursor: "pointer", fontSize: 14, color: "var(--color-text-secondary)", marginBottom: "1.25rem", display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}>
          <span style={{ fontSize: 20, lineHeight: 1 }}>+</span> Add an expense
        </button>
      ) : (
        <div style={{ background: "var(--color-background-primary)", border: "0.5px solid var(--color-border-tertiary)", borderRadius: "var(--border-radius-lg)", padding: "1.25rem", marginBottom: "1.25rem" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
            <h3 style={{ fontSize: 14, fontWeight: 500, margin: 0 }}>New expense</h3>
            <button onClick={() => setShowForm(false)} style={{ background: "none", border: "none", cursor: "pointer", fontSize: 20, color: "var(--color-text-secondary)", lineHeight: 1 }}>×</button>
          </div>

          {/* Bucket selector */}
          <p style={{ fontSize: 12, color: "var(--color-text-secondary)", margin: "0 0 8px" }}>Which bucket does this come from?</p>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8, marginBottom: 16 }}>
            {BUCKETS.map(b => {
              const bal = bucketBalance(b.key);
              const selected = form.bucket === b.key;
              return (
                <button key={b.key} onClick={() => setForm(p => ({ ...p, bucket: b.key }))}
                  style={{ padding: "10px 8px", borderRadius: "var(--border-radius-md)", border: `1.5px solid ${selected ? b.color : "var(--color-border-tertiary)"}`, background: selected ? b.color + "15" : "transparent", cursor: "pointer", textAlign: "left" }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 5, marginBottom: 3 }}>
                    <span style={{ width: 8, height: 8, borderRadius: 2, background: b.color, flexShrink: 0 }} />
                    <span style={{ fontSize: 12, fontWeight: 500, color: selected ? b.color : "var(--color-text-primary)" }}>{b.label}</span>
                  </div>
                  <span style={{ fontSize: 11, color: bal < 0 ? "#ef4444" : "var(--color-text-secondary)", paddingLeft: 13 }}>{fmt(bal, 2)}</span>
                </button>
              );
            })}
          </div>

          <Input label="Date" type="date" value={form.date} onChange={v => setForm(p => ({ ...p, date: v }))} />
          <Input label="Amount (AUD)" type="number" value={form.amount} onChange={v => setForm(p => ({ ...p, amount: v }))} placeholder="0.00" step="0.01" />
          <Input label="Note (optional)" value={form.notes} onChange={v => setForm(p => ({ ...p, notes: v }))} placeholder="What was this for?" />

          {form.bucket && form.amount && (
            <div style={{ background: "var(--color-background-secondary)", borderRadius: "var(--border-radius-md)", padding: "10px 14px", marginBottom: "1rem" }}>
              <p style={{ fontSize: 13, margin: 0 }}>
                <span style={{ color: "var(--color-text-secondary)" }}>Balance after: </span>
                <strong style={{ color: bucketBalance(form.bucket) - (parseFloat(form.amount)||0) >= 0 ? "#22c55e" : "#ef4444" }}>
                  {fmt(bucketBalance(form.bucket) - (parseFloat(form.amount)||0), 2)}
                </strong>
              </p>
            </div>
          )}

          <div style={{ display: "flex", gap: 10 }}>
            <button onClick={handleSave} disabled={!form.bucket || !form.amount}
              style={{ flex: 1, padding: "10px", borderRadius: "var(--border-radius-md)", background: form.bucket && form.amount ? "#3b82f6" : "var(--color-background-secondary)", color: form.bucket && form.amount ? "#fff" : "var(--color-text-secondary)", border: "none", cursor: form.bucket && form.amount ? "pointer" : "default", fontSize: 14, fontWeight: 500 }}>
              Save expense
            </button>
            <button onClick={() => setShowForm(false)} style={{ padding: "10px 16px", borderRadius: "var(--border-radius-md)", background: "none", border: "0.5px solid var(--color-border-secondary)", cursor: "pointer", fontSize: 14, color: "var(--color-text-secondary)" }}>
              Cancel
            </button>
          </div>
        </div>
      )}

      {/* Monthly tracker by bucket */}
      <div style={{ background: "var(--color-background-primary)", border: "0.5px solid var(--color-border-tertiary)", borderRadius: "var(--border-radius-lg)", padding: "1.25rem", marginBottom: "1.25rem" }}>
        <h3 style={{ fontSize: 14, fontWeight: 500, margin: "0 0 16px" }}>Monthly spending by bucket</h3>
        <div style={{ overflowX: "auto" }}>
          <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12 }}>
            <thead>
              <tr style={{ borderBottom: "0.5px solid var(--color-border-tertiary)" }}>
                <th style={{ padding: "5px 8px", fontWeight: 500, color: "var(--color-text-secondary)", textAlign: "left", whiteSpace: "nowrap" }}>Bucket</th>
                {months.map(m => (
                  <th key={m} style={{ padding: "5px 8px", fontWeight: 500, color: "var(--color-text-secondary)", textAlign: "right", whiteSpace: "nowrap" }}>{monthLabel(m)}</th>
                ))}
                <th style={{ padding: "5px 8px", fontWeight: 500, color: "var(--color-text-secondary)", textAlign: "right" }}>Total</th>
              </tr>
            </thead>
            <tbody>
              {BUCKETS.map(b => {
                const monthTotals = months.map(m => data.expenses.filter(e => e.bucket === b.key && e.date.startsWith(m)).reduce((s, e) => s + e.amount, 0));
                const total = monthTotals.reduce((s, v) => s + v, 0);
                if (total === 0) return null;
                return (
                  <tr key={b.key} style={{ borderBottom: "0.5px solid var(--color-border-tertiary)" }}>
                    <td style={{ padding: "7px 8px", whiteSpace: "nowrap" }}>
                      <span style={{ display: "flex", alignItems: "center", gap: 6 }}>
                        <span style={{ width: 8, height: 8, borderRadius: 2, background: b.color, flexShrink: 0 }} />
                        <span style={{ fontWeight: 500 }}>{b.label}</span>
                      </span>
                    </td>
                    {monthTotals.map((v, i) => (
                      <td key={i} style={{ padding: "7px 8px", textAlign: "right", color: v === 0 ? "var(--color-text-secondary)" : "var(--color-text-primary)" }}>
                        {v === 0 ? "—" : fmt(v, 2)}
                      </td>
                    ))}
                    <td style={{ padding: "7px 8px", textAlign: "right", fontWeight: 500 }}>{fmt(total, 2)}</td>
                  </tr>
                );
              })}
              <tr style={{ borderTop: "0.5px solid var(--color-border-secondary)" }}>

// ========= PORTFOLIO =========
function Portfolio({ data, update, dbHelpers }) {
  const [modal, setModal] = useState(false);
  const [form, setForm] = useState({ asset: "", type: "ETF", units: "", price: "", costBasis: "" });

  const total = data.portfolio.reduce((s, h) => s + h.units * h.price, 0);
  const totalCost = data.portfolio.reduce((s, h) => s + (h.costBasis || 0), 0);
  const totalGain = total - totalCost;
  const gainPct = totalCost > 0 ? (totalGain / totalCost) * 100 : 0;

  const byType = ["ETF", "Stock", "Crypto", "Gold"].map(t => ({
    type: t,
    value: data.portfolio.filter(h => h.type === t).reduce((s, h) => s + h.units * h.price, 0),
  })).filter(t => t.value > 0);

  const handleAdd = async () => {
    if (!form.asset || !form.units || !form.price) return;
    const newItem = { ...form, id: Date.now(), units: parseFloat(form.units), price: parseFloat(form.price), costBasis: parseFloat(form.costBasis) || 0 };
    if (dbHelpers?.savePortfolioItem) {
      const row = await dbHelpers.savePortfolioItem(newItem);
      if (row) newItem.id = row.id;
    }
    update(d => ({ ...d, portfolio: [...d.portfolio, newItem] }));
    setModal(false);
    setForm({ asset: "", type: "ETF", units: "", price: "", costBasis: "" });
  };

  const handleDelete = (id) => { update(d => ({ ...d, portfolio: d.portfolio.filter(h => h.id !== id) })); if (dbHelpers?.deletePortfolioItem) dbHelpers.deletePortfolioItem(id); };

  const handleFieldChange = (id, field, value) => {
    const parsed = parseFloat(value);
    if (!isNaN(parsed)) {
      update(d => {
        const next = d.portfolio.map(h => h.id === id ? { ...h, [field]: parsed } : h);
        if (dbHelpers?.updatePortfolioItem) {
          const h = next.find(x => x.id === id);
          if (h) dbHelpers.updatePortfolioItem(id, { units: h.units, price: h.price, costBasis: h.costBasis });
        }
        return { ...d, portfolio: next };
      });
    }
  };

  // Local edit state so inputs are controlled and editable
  const [editVals, setEditVals] = useState(() =>
    Object.fromEntries(data.portfolio.map(h => [h.id, { units: String(h.units), price: String(h.price), costBasis: String(h.costBasis || 0) }]))
  );

  // Keep editVals in sync when portfolio changes (new holdings added)
  useEffect(() => {
    setEditVals(prev => {
      const next = { ...prev };
      data.portfolio.forEach(h => {
        if (!next[h.id]) next[h.id] = { units: String(h.units), price: String(h.price), costBasis: String(h.costBasis || 0) };
      });
      return next;
    });
  }, [data.portfolio.length]);

  const setEdit = (id, field, val) => setEditVals(prev => ({ ...prev, [id]: { ...prev[id], [field]: val } }));
  const commitEdit = (id, field) => handleFieldChange(id, field, editVals[id]?.[field]);

  const typeColors = { ETF: "#3b82f6", Stock: "#8b5cf6", Crypto: "#f59e0b", Gold: "#eab308" };

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: "1.5rem" }}>
        <div>
          <h1 style={{ fontSize: 22, fontWeight: 500, margin: "0 0 4px" }}>Portfolio</h1>
          <p style={{ color: "var(--color-text-secondary)", margin: 0, fontSize: 14 }}>Track your investments and wealth</p>
        </div>
        <button onClick={() => setModal(true)} style={{ padding: "8px 16px", borderRadius: "var(--border-radius-md)", background: "#8b5cf6", color: "#fff", border: "none", cursor: "pointer", fontSize: 13 }}>
          + Add holding
        </button>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(140px, 1fr))", gap: 12, marginBottom: "1.5rem" }}>
        <StatCard label="Portfolio value" value={fmt(total)} color="#3b82f6" />
        <StatCard label="Total cost" value={fmt(totalCost)} />
        <StatCard label="Total gain/loss" value={fmt(totalGain)} color={totalGain >= 0 ? "#22c55e" : "#ef4444"} sub={pct(gainPct)} />
        <StatCard label="Holdings" value={data.portfolio.length + " assets"} />
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "1rem", marginBottom: "1.5rem" }}>
        <div style={{ background: "var(--color-background-primary)", border: "0.5px solid var(--color-border-tertiary)", borderRadius: "var(--border-radius-lg)", padding: "1.25rem" }}>
          <h3 style={{ fontSize: 14, fontWeight: 500, margin: "0 0 12px" }}>Allocation by type</h3>
          {byType.map(t => {
            const p = (t.value / total) * 100;
            return (
              <div key={t.type} style={{ marginBottom: 10 }}>
                <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 3 }}>
                  <span style={{ fontSize: 13, color: typeColors[t.type] }}>●  {t.type}</span>
                  <span style={{ fontSize: 13, fontWeight: 500 }}>{fmt(t.value)} · {p.toFixed(1)}%</span>
                </div>
                <ProgressBar pct={p} color={typeColors[t.type]} />
              </div>
            );
          })}
        </div>
        <div style={{ background: "var(--color-background-primary)", border: "0.5px solid var(--color-border-tertiary)", borderRadius: "var(--border-radius-lg)", padding: "1.25rem" }}>
          <h3 style={{ fontSize: 14, fontWeight: 500, margin: "0 0 12px" }}>Top 5 holdings by value</h3>
          {[...data.portfolio].sort((a, b) => b.units * b.price - a.units * a.price).slice(0, 5).map(h => (
            <div key={h.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
              <div>
                <span style={{ fontSize: 13, fontWeight: 500 }}>{h.asset}</span>
                <span style={{ fontSize: 11, color: "var(--color-text-secondary)", marginLeft: 6 }}>{h.type}</span>
              </div>
              <span style={{ fontSize: 13, fontWeight: 500 }}>{fmt(h.units * h.price)}</span>
            </div>
          ))}
        </div>
      </div>

      <div style={{ background: "var(--color-background-primary)", border: "0.5px solid var(--color-border-tertiary)", borderRadius: "var(--border-radius-lg)", padding: "1.25rem" }}>
        <h3 style={{ fontSize: 14, fontWeight: 500, margin: "0 0 16px" }}>All holdings — click any value to edit</h3>
        <div style={{ overflowX: "auto" }}>
          <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
            <thead>
              <tr style={{ borderBottom: "0.5px solid var(--color-border-tertiary)" }}>
                {["Asset", "Type", "Units", "Price (AUD)", "Value", "Cost", "P/L", ""].map((h, i) => (
                  <th key={i} style={{ textAlign: i >= 4 ? "right" : "left", padding: "6px 8px", fontWeight: 500, color: "var(--color-text-secondary)", whiteSpace: "nowrap" }}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {[...data.portfolio].sort((a, b) => b.units * b.price - a.units * a.price).map(h => {
                const ev = editVals[h.id] || { units: String(h.units), price: String(h.price), costBasis: String(h.costBasis || 0) };
                const val = h.units * h.price;
                const gain = val - (h.costBasis || 0);
                const cellStyle = { width: 80, padding: "5px 7px", border: "0.5px solid var(--color-border-secondary)", borderRadius: 4, fontSize: 13, background: "var(--color-background-secondary)", color: "var(--color-text-primary)" };
                return (
                  <tr key={h.id} style={{ borderBottom: "0.5px solid var(--color-border-tertiary)" }}>
                    <td style={{ padding: "7px 8px", fontWeight: 500 }}>{h.asset}</td>

                    <td style={{ padding: "7px 8px" }}>
                      <input
                        type="number" value={ev.units}
                        onChange={e => setEdit(h.id, "units", e.target.value)}
                        onBlur={() => commitEdit(h.id, "units")}
                        step="0.000001" style={{ ...cellStyle, width: 75 }}
                      />
                    </td>
                    <td style={{ padding: "7px 8px" }}>
                      <input
                        type="number" value={ev.price}
                        onChange={e => setEdit(h.id, "price", e.target.value)}
                        onBlur={() => commitEdit(h.id, "price")}
                        step="0.01" style={cellStyle}
                      />
                    </td>
                    <td style={{ padding: "7px 8px", textAlign: "right", fontWeight: 500 }}>{fmt(val)}</td>

                      <input
